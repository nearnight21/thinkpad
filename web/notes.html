<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkPad · 笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* ============ 设计系统 ============ */
:root {
    --bg: #FAF7F0;
    --surface: #FFFFFF;
    --surface-warm: #F3EFE4;
    --border: #E7E1D2;
    --border-soft: #EFEBDF;
    --text: #2E2A24;
    --text-2: #6B6457;
    --text-3: #9C9484;
    --accent: #8A9B6E;
    --accent-dark: #6F8055;
    --accent-soft: #EDF1E3;
    --danger: #C4634F;
    --danger-soft: #F7E9E5;
    --c-note: #8A9B6E;
    --c-thought: #D9A05B;
    --c-question: #7C9EB2;
    --c-link: #B089A8;
    --c-code: #C4785C;
    --font-ui: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    --font-serif: 'Source Serif 4', 'Noto Serif SC', Georgia, serif;
    --shadow-sm: 0 1px 2px rgba(46, 42, 36, .05);
    --shadow-md: 0 6px 24px rgba(46, 42, 36, .10);
    --shadow-lg: 0 16px 48px rgba(46, 42, 36, .16);
    --radius: 12px;
    --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
.spacer { flex: 1; }
.material-symbols-rounded {
    font-size: 20px;
    vertical-align: middle;
    user-select: none;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D8D1C0; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #C4BCA8; }

/* ============ 通用组件 ============ */
.btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 999px;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-sm);
    transition: background .15s, transform .1s;
}
.btn-primary:hover { background: var(--accent-dark); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    color: var(--text-2); font-size: 13px; font-weight: 500;
    transition: background .15s, color .15s;
}
.btn-ghost:hover { background: var(--surface-warm); color: var(--text); }
.icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 999px;
    color: var(--text-2); transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-warm); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

/* ============ 登录页 ============ */
#loginPage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
        radial-gradient(1000px 600px at 15% 10%, #F0EAD8 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 90%, #E9EEE0 0%, transparent 55%),
        var(--bg);
    padding: 24px;
}
.login-card {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    padding: 40px 36px 32px;
}
.login-logo {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border-radius: 18px;
    background: var(--accent-soft); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
}
.login-logo .material-symbols-rounded { font-size: 30px; }
.login-title {
    font-family: var(--font-serif);
    font-size: 26px; font-weight: 700; text-align: center;
    letter-spacing: .5px;
}
.login-sub {
    text-align: center; color: var(--text-3);
    font-size: 13px; margin: 6px 0 28px;
}
.login-card label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-2); margin: 14px 0 6px;
}
.login-card input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); outline: none;
    transition: border-color .15s, box-shadow .15s;
}
.login-card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--surface);
}
#loginError {
    color: var(--danger); font-size: 12.5px;
    min-height: 20px; margin-top: 10px; text-align: center;
}
.login-actions { display: flex; gap: 10px; margin-top: 8px; }
.login-actions .btn-primary { flex: 1; justify-content: center; padding: 11px; }
.login-actions .btn-ghost { flex: 1; justify-content: center; padding: 11px; border: 1px solid var(--border); }

/* ============ 三栏布局 ============ */
#appPage {
    display: grid;
    grid-template-columns: 236px 344px 1fr;
    height: 100vh;
    overflow: hidden;
}

/* ---- 筛选栏 ---- */
#sidebar {
    display: flex; flex-direction: column;
    background: var(--surface-warm);
    border-right: 1px solid var(--border-soft);
    min-height: 0;
    z-index: 40;
}
.side-top { padding: 18px 16px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.brand-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
}
.brand-name {
    font-family: var(--font-serif);
    font-size: 19px; font-weight: 700; letter-spacing: .3px;
}
.search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    transition: border-color .15s, box-shadow .15s;
}
.search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-box .material-symbols-rounded { font-size: 18px; color: var(--text-3); flex-shrink: 0; }
.search-box input {
    flex: 1; min-width: 0; border: none; outline: none;
    background: transparent; font-size: 13px;
}
.search-box input::placeholder { color: var(--text-3); }
#searchClear { display: inline-flex; color: var(--text-3); }
#searchClear:hover { color: var(--text); }
#searchClear .material-symbols-rounded { font-size: 16px; }
.side-nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.side-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--text-3); text-transform: uppercase;
    padding: 14px 8px 6px;
}
.side-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 7px 8px;
    border-radius: var(--radius-sm);
    font-size: 13.5px; color: var(--text-2);
    transition: background .12s, color .12s;
    text-align: left;
}
.side-item:hover { background: rgba(255,255,255,.65); color: var(--text); }
.side-item.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }
.side-item .material-symbols-rounded { font-size: 18px; flex-shrink: 0; }
.side-item .side-count {
    margin-left: auto; font-size: 11.5px; font-weight: 500;
    color: var(--text-3); font-variant-numeric: tabular-nums;
}
.side-item .tag-hash { color: var(--accent); font-weight: 700; font-size: 13px; }
.type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin: 0 5px; }
.side-account {
    border-top: 1px solid var(--border-soft);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
}
.account-email {
    font-size: 12px; color: var(--text-3);
    padding: 0 8px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.side-account .side-item { font-size: 13px; }
#sidebarOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(46,42,36,.35);
    z-index: 35;
}

/* ---- 笔记列表 ---- */
#listPane {
    display: flex; flex-direction: column;
    background: var(--bg);
    border-right: 1px solid var(--border-soft);
    min-height: 0;
}
.list-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
}
.list-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.list-title h2 {
    font-size: 15px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-title span { font-size: 12px; color: var(--text-3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
#noteList { flex: 1; overflow-y: auto; padding: 8px; }
.note-item {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    transition: background .12s, border-color .12s, box-shadow .12s;
    margin-bottom: 2px;
}
.note-item:hover { background: var(--surface); border-color: var(--border-soft); }
.note-item.active {
    background: var(--surface);
    border-color: var(--border);
    box-shadow: var(--shadow-sm);
}
.note-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.note-item-title {
    font-size: 14px; font-weight: 600; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
}
.note-item-excerpt {
    font-size: 12.5px; color: var(--text-2); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 2px 0 6px;
}
.note-item-meta { display: flex; align-items: center; gap: 6px; }
.note-item-date { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.note-item-tags { display: flex; gap: 4px; overflow: hidden; margin-left: auto; }
.mini-tag {
    font-size: 11px; color: var(--accent-dark);
    background: var(--accent-soft);
    padding: 1px 7px; border-radius: 999px;
    white-space: nowrap;
}
#listFooter {
    padding: 12px; text-align: center;
    font-size: 12px; color: var(--text-3);
    flex-shrink: 0;
}
.list-empty {
    padding: 48px 24px; text-align: center; color: var(--text-3);
}
.list-empty .material-symbols-rounded { font-size: 40px; display: block; margin-bottom: 10px; opacity: .5; }
.list-empty p { font-size: 13px; }
</style>
<style>
/* ---- 阅读区 ---- */
#readerPane {
    position: relative;
    background: var(--surface);
    min-width: 0; min-height: 0;
    z-index: 30;
}
#readerPane > * { height: 100%; }
#readerEmpty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: var(--text-3);
    background:
        radial-gradient(700px 400px at 50% 0%, var(--surface-warm) 0%, transparent 70%),
        var(--surface);
    padding: 24px; text-align: center;
}
#readerEmpty .empty-icon {
    width: 72px; height: 72px; border-radius: 24px;
    background: var(--accent-soft); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
}
#readerEmpty .empty-icon .material-symbols-rounded { font-size: 36px; }
#readerEmpty h3 { font-family: var(--font-serif); font-size: 20px; color: var(--text-2); font-weight: 600; }
#readerEmpty p { font-size: 13px; max-width: 300px; }
#readerEmpty .btn-primary { margin-top: 14px; }

#readerView { display: flex; flex-direction: column; }
.reader-topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(6px);
}
.type-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
}
.type-badge .material-symbols-rounded { font-size: 15px; }
.reader-dates { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.reader-scroll { flex: 1; overflow-y: auto; }
.reader-inner {
    max-width: 720px; margin: 0 auto;
    padding: 48px 40px 96px;
}
#readerTitle {
    font-family: var(--font-serif);
    font-size: 32px; font-weight: 700; line-height: 1.3;
    margin-bottom: 10px;
    overflow-wrap: break-word;
}
#readerTitle a { color: inherit; text-decoration: none; border-bottom: 2px solid var(--accent); }
#readerTitle a:hover { color: var(--accent-dark); }
#readerLink { margin-bottom: 14px; }
.link-card {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: var(--radius-sm);
    background: var(--accent-soft); color: var(--accent-dark);
    font-size: 13.5px; font-weight: 600; text-decoration: none;
    transition: background .15s;
    overflow-wrap: anywhere;
}
.link-card:hover { background: #E2E9D3; }
#readerTags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
.reader-tag {
    font-size: 12.5px; color: var(--accent-dark);
    background: var(--accent-soft);
    padding: 3px 11px; border-radius: 999px;
    transition: background .15s;
}
.reader-tag:hover { background: #E2E9D3; }

/* ---- Markdown 排版 ---- */
.md-body {
    font-family: var(--font-serif);
    font-size: 16.5px; line-height: 1.85;
    color: var(--text);
    overflow-wrap: break-word;
}
.md-body > *:first-child { margin-top: 0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 {
    font-weight: 700; line-height: 1.4;
    margin: 1.6em 0 .6em;
}
.md-body h1 { font-size: 1.55em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
.md-body h2 { font-size: 1.32em; }
.md-body h3 { font-size: 1.14em; }
.md-body h4 { font-size: 1em; }
.md-body p { margin: .85em 0; }
.md-body a { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
.md-body a:hover { color: var(--accent); }
.md-body strong { font-weight: 700; }
.md-body ul, .md-body ol { margin: .85em 0; padding-left: 1.6em; }
.md-body li { margin: .3em 0; }
.md-body li::marker { color: var(--accent); }
.md-body blockquote {
    margin: 1.1em 0; padding: .6em 1.2em;
    border-left: 3px solid var(--accent);
    background: var(--surface-warm);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-2);
}
.md-body blockquote p { margin: .3em 0; }
.md-body code {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    font-size: .86em;
    background: var(--surface-warm);
    border: 1px solid var(--border-soft);
    padding: .15em .45em; border-radius: 5px;
}
.md-body pre {
    margin: 1.1em 0; padding: 16px 18px;
    background: #33302A; color: #EDE8DC;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    font-size: 13.5px; line-height: 1.7;
}
.md-body pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
.md-body img {
    max-width: 100%; height: auto;
    border-radius: var(--radius-sm);
    margin: .6em auto; display: block;
    box-shadow: var(--shadow-md);
    cursor: zoom-in;
}
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
.md-body table {
    width: 100%; border-collapse: collapse;
    margin: 1.1em 0; font-size: .92em;
    font-family: var(--font-ui);
}
.md-body th, .md-body td {
    border: 1px solid var(--border);
    padding: 8px 12px; text-align: left;
}
.md-body th { background: var(--surface-warm); font-weight: 600; }
.md-body input[type="checkbox"] { margin-right: 6px; accent-color: var(--accent); }

/* ---- 编辑器 ---- */
#editorView { display: flex; flex-direction: column; background: var(--surface); }
.editor-topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
}
.editor-topbar-title { font-size: 15px; font-weight: 700; }
.editor-scroll { flex: 1; overflow-y: auto; }
.editor-inner {
    max-width: 760px; margin: 0 auto;
    padding: 32px 40px 64px;
    display: flex; flex-direction: column; gap: 14px;
}
#titleInput {
    font-family: var(--font-serif);
    font-size: 26px; font-weight: 700;
    border: none; outline: none;
    padding: 4px 0;
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: border-color .15s;
}
#titleInput:focus { border-bottom-color: var(--border); }
#titleInput::placeholder { color: #C9C2B2; }
#linkInput {
    padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); outline: none;
    font-size: 13.5px;
    transition: border-color .15s, box-shadow .15s;
}
#linkInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
#typeChips { display: flex; flex-wrap: wrap; gap: 8px; }
.type-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 13px; font-weight: 500; color: var(--text-2);
    transition: all .15s;
}
.type-chip .material-symbols-rounded { font-size: 16px; }
.type-chip:hover { border-color: var(--text-3); color: var(--text); }
.type-chip.active { color: #fff; border-color: transparent; }
.tag-editor {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg);
    transition: border-color .15s, box-shadow .15s;
}
.tag-editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 500;
    color: var(--accent-dark); background: var(--accent-soft);
    padding: 3px 6px 3px 10px; border-radius: 999px;
}
.tag-chip button { display: inline-flex; color: inherit; opacity: .6; border-radius: 50%; }
.tag-chip button:hover { opacity: 1; }
.tag-chip .material-symbols-rounded { font-size: 14px; }
#tagInput {
    flex: 1; min-width: 120px;
    border: none; outline: none; background: transparent;
    font-size: 13px; padding: 4px 0;
}
.editor-toolbar {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--border-soft);
    border-bottom: none;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    background: var(--surface-warm);
    padding: 6px 10px;
}
.editor-toolbar .btn-ghost { padding: 6px 10px; font-size: 12.5px; }
#uploadStatus { font-size: 12px; color: var(--accent-dark); margin-left: 8px; }
#contentInput {
    min-height: 320px;
    border: 1px solid var(--border-soft);
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    padding: 16px 18px;
    outline: none; resize: vertical;
    font-family: 'SFMono-Regular', Consolas, 'Noto Sans SC', monospace;
    font-size: 14px; line-height: 1.8;
    background: var(--surface);
    transition: border-color .15s, box-shadow .15s;
}
#contentInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#previewPane {
    border: 1px solid var(--border-soft);
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    padding: 8px 18px 24px;
    min-height: 320px;
}

/* ---- 浮层：确认框 / 改密码 ---- */
.modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(46,42,36,.4);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
}
.modal-card {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 28px;
}
.modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.modal-card .modal-msg { font-size: 13.5px; color: var(--text-2); margin-bottom: 20px; }

/* ============================================================

 * ============================================================ */
const $ = (id) => document.getElementById(id);

function esc(s) {
    return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function icon(name) {
    return `<span class="material-symbols-rounded">${name}</span>`;
}

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function fmtDateShort(iso) {
    const d = new Date(iso);
    const now = new Date();
    if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
}

/* 从 Markdown 提取纯文本摘要 */
function excerpt(content, len = 90) {
    const text = String(content || "")
        .replace(/!\[[^\]]*\]\([^)]*\)/g, "[图片]")
        .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
        .replace(/```[\s\S]*?```/g, " [代码] ")
        .replace(/`([^`]*)`/g, "$1")
        .replace(/^#{1,6}\s*/gm, "")
        .replace(/^\s*[-*+>]\s+/gm, "")
        .replace(/^\s*\d+\.\s+/gm, "")
        .replace(/[*_~]{1,3}([^*_~]+)[*_~]{1,3}/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
    return text.length > len ? text.slice(0, len) + "…" : text;
}

/* 无标题时取正文前 40 字 */
function displayTitle(entry) {
    if (entry.title && entry.title.trim()) return entry.title.trim();
    return excerpt(entry.content, 40) || "无标题";
}

/* 解析 link 类型的 "URL · 标题" */
function parseLinkTitle(title) {
    const m = /^(https?:\/\/\S+?)(?:\s*·\s*(.*))?$/.exec((title || "").trim());
    if (!m) return null;
    return { url: m[1], text: (m[2] || "").trim() };
}

/* 在 textarea 光标处插入文本 */
function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? textarea.value.length;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    const pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
}

/* Toast */
let toastTimer = null;
function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

/* 通用确认框（返回 Promise<boolean>） */
let confirmResolve = null;
function showConfirm(title, msg, okText = "确认") {
    $("confirmTitle").textContent = title;
    $("confirmMsg").textContent = msg;
    $("confirmOk").textContent = okText;
    $("confirmModal").classList.remove("hidden");
    return new Promise((resolve) => { confirmResolve = resolve; });
}
function closeConfirm(result) {
    $("confirmModal").classList.add("hidden");
    if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

/* Markdown 渲染（marked + DOMPurify，CDN 失败时降级为转义段落） */
if (window.marked) {
    marked.setOptions({ breaks: true, gfm: true });
}
function renderMarkdown(source) {
    if (window.marked && window.DOMPurify) {
        return DOMPurify.sanitize(marked.parse(source || ""));
    }
    return esc(source || "")
        .split(/\n{2,}/)
        .map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`)
        .join("");
}

/* ============================================================

function showLogin() {

async function showApp() {

<script>
"use strict";

/* ============================================================
 * 数据层（entries 表）
 * ============================================================ */
async function fetchEntries(reset) {
    if (state.loading) return;
    if (reset) {
        state.page = 0;
        state.entries = [];
        state.hasMore = true;
    }
    if (!state.hasMore) return;
    state.loading = true;
    renderListFooter();

    const from = state.page * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;
    let query = sb
        .from("entries")
        .select("*")
        .eq("user_id", state.session.user.id)
        .order("created_at", { ascending: false })
        .range(from, to);
    if (state.filterType !== "all") query = query.eq("type", state.filterType);
    if (state.filterTag) query = query.contains("tags", [state.filterTag]);
    if (state.searchQuery) {
        const q = state.searchQuery.replace(/[,%()"]/g, " ").trim();
        if (q) query = query.or(`title.ilike.%${q}%,content.ilike.%${q}%`);
    }

    const { data, error } = await query;
    state.loading = false;
    if (error) {
        console.error(error);
        toast("加载失败：" + (error.message || "未知错误"));
        renderListFooter();
        return;
    }
    state.entries = reset ? data : state.entries.concat(data);
    state.hasMore = data.length === PAGE_SIZE;
    state.page += 1;
    renderList();
    renderListFooter();
}

/* 轻量聚合：全量拉 type/tags，给侧栏准确的类型/标签计数 */
async function fetchFacets() {
    const { data, error } = await sb
        .from("entries")
        .select("type,tags")
        .eq("user_id", state.session.user.id);
    if (error) { console.error(error); return; }
    const typeCounts = {};
    const tagCounts = {};
    for (const row of data) {
        typeCounts[row.type] = (typeCounts[row.type] || 0) + 1;
        for (const t of row.tags || []) tagCounts[t] = (tagCounts[t] || 0) + 1;
    }
    state.facets = { typeCounts, tagCounts, total: data.length };
    renderSidebar();
}

async function createEntry(fields) {
    const { data, error } = await sb
        .from("entries")
        .insert({ user_id: state.session.user.id, ...fields })
        .select()
        .single();
    if (error) throw error;
    return data;
}

async function updateEntry(id, fields) {
    const { data, error } = await sb
        .from("entries")
        .update(fields)
        .eq("id", id)
        .select()
        .single();
    if (error) throw error;
    return data;
}

async function deleteEntry(id) {
    const { error } = await sb.from("entries").delete().eq("id", id);
    if (error) throw error;
}

/* ============================================================
 * 侧栏渲染
 * ============================================================ */
function renderSidebar() {
    const { typeCounts, tagCounts, total } = state.facets;

    // 类型
    const typeItems = [
        { key: "all", name: "全部", icon: "inbox", count: total },
        ...TYPE_ORDER.map((t) => ({
            key: t,
            name: TYPES[t].name,
            icon: TYPES[t].icon,
            color: TYPES[t].color,
            count: typeCounts[t] || 0,
        })),
    ];
    $("typeList").innerHTML = typeItems.map((item) => `
        <button class="side-item ${state.filterType === item.key ? "active" : ""}" data-type="${item.key}">
            ${item.color
                ? `<span class="type-dot" style="background:${item.color}"></span>`
                : icon("inbox")}
            <span>${item.name}</span>
            <span class="side-count">${item.count}</span>
        </button>
    `).join("");

    // 标签（按计数降序）
    const tags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh"));
    $("tagList").innerHTML = tags.length === 0
        ? `<div style="padding:4px 8px;font-size:12.5px;color:var(--text-3)">暂无标签</div>`
        : tags.map(([tag, count]) => `
            <button class="side-item ${state.filterTag === tag ? "active" : ""}" data-tag="${esc(tag)}">
                <span class="tag-hash">#</span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tag)}</span>
                <span class="side-count">${count}</span>
            </button>
        `).join("");
}

function currentFilterLabel() {
    const parts = [];
    parts.push(state.filterType === "all" ? "全部笔记" : TYPES[state.filterType].name);
    if (state.filterTag) parts.push("#" + state.filterTag);
    if (state.searchQuery) parts.push(`“${state.searchQuery}”`);
    return parts.join(" · ");
}

/* ============================================================
 * 列表渲染
 * ============================================================ */
function renderList() {
    $("listTitle").textContent = currentFilterLabel();
    $("listCount").textContent = state.entries.length + (state.hasMore ? "+" : "") + " 条";

    if (state.entries.length === 0) {
        $("noteList").innerHTML = state.loading ? "" : `
            <div class="list-empty">
                <span class="material-symbols-rounded">note_stack</span>
                <p>${state.searchQuery || state.filterTag || state.filterType !== "all" ? "没有匹配的笔记" : "还没有笔记，点击右上角「新建」开始"}</p>
            </div>`;
        return;
    }

    $("noteList").innerHTML = state.entries.map((e) => {
        const t = TYPES[e.type] || TYPES.note;
        const tags = (e.tags || []).slice(0, 3).map((tag) => `<span class="mini-tag">${esc(tag)}</span>`).join("");
        return `
        <button class="note-item ${state.selectedId === e.id ? "active" : ""}" data-id="${e.id}">
            <div class="note-item-head">
                <span class="type-dot" style="background:${t.color}"></span>
                <span class="note-item-title">${esc(displayTitle(e))}</span>
            </div>
            <div class="note-item-excerpt">${esc(excerpt(e.content))}</div>
            <div class="note-item-meta">
                <span class="note-item-date">${fmtDateShort(e.created_at)}</span>
                <span class="note-item-tags">${tags}</span>
            </div>
        </button>`;
    }).join("");
}

function renderListFooter() {
    const el = $("listFooter");
    if (state.loading) el.textContent = "加载中…";
    else if (!state.hasMore && state.entries.length > 0) el.textContent = "— 没有更多了 —";
    else el.textContent = "";
}

/* 只更新选中态，避免整表重绘 */
function renderListActive() {
    document.querySelectorAll(".note-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === state.selectedId);
    });
}
</script>

<script>
"use strict";

/* ============================================================
 * 阅读区
 * ============================================================ */
function selectedEntry() {
    return state.entries.find((e) => e.id === state.selectedId) || null;
}

function selectEntry(id) {
    state.selectedId = id;
    state.editing = false;
    state.editingId = null;
    renderListActive();
    renderReader();
    // 移动端：滑入阅读页
    if (window.innerWidth < 1024) document.body.classList.add("reader-open");
}

function renderReader() {
    const entry = selectedEntry();
    $("readerEmpty").classList.toggle("hidden", !!entry || state.editing);
    $("readerView").classList.toggle("hidden", !entry || state.editing);
    $("editorView").classList.toggle("hidden", !state.editing);
    if (!entry || state.editing) return;

    const t = TYPES[entry.type] || TYPES.note;

    // 顶栏
    $("readerTypeBadge").innerHTML =
        `<span class="type-badge" style="color:${t.color};background:color-mix(in srgb, ${t.color} 14%, white)">${icon(t.icon)}${t.name}</span>`;
    const created = new Date(entry.created_at);
    const updated = new Date(entry.updated_at);
    $("readerDates").textContent = fmtDate(entry.created_at) +
        (updated - created > 60 * 1000 ? ` · 更新于 ${fmtDate(entry.updated_at)}` : "");

    // 标题（link 类型解析出可点击外链）
    const link = entry.type === "link" ? parseLinkTitle(entry.title) : null;
    if (link) {
        $("readerTitle").innerHTML = link.text
            ? esc(link.text)
            : `<a href="${esc(link.url)}" target="_blank" rel="noopener">${esc(link.url)}</a>`;
        $("readerLink").innerHTML =
            `<a class="link-card" href="${esc(link.url)}" target="_blank" rel="noopener">${icon("open_in_new")}<span>${esc(link.url)}</span></a>`;
        $("readerLink").classList.remove("hidden");
    } else {
        $("readerTitle").textContent = displayTitle(entry);
        $("readerLink").innerHTML = "";
        $("readerLink").classList.add("hidden");
    }

    // 标签（点击可筛选）
    const tags = entry.tags || [];
    $("readerTags").innerHTML = tags.map((tag) =>
        `<button class="reader-tag" data-tag="${esc(tag)}">#${esc(tag)}</button>`
    ).join("");
    $("readerTags").classList.toggle("hidden", tags.length === 0);

    // 正文
    $("readerContent").innerHTML = renderMarkdown(entry.content);
    document.querySelector("#readerView .reader-scroll").scrollTop = 0;
}

function toggleFocusMode() {
    const on = document.body.classList.toggle("focus-mode");
    $("focusBtn").querySelector(".material-symbols-rounded").textContent = on ? "fullscreen_exit" : "fullscreen";
    $("focusBtn").title = on ? "退出专注模式" : "专注模式";
}

/* ============================================================
 * 图片上传（Cloudflare R2 Worker）
 * ============================================================ */
async function uploadImageToR2(file) {
    const ext = ((file.name || "").split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
    const key = `${state.session.user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const formData = new FormData();
    formData.append("file", file);
    formData.append("key", key);
    const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: formData });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.url) throw new Error(data.error || `HTTP ${res.status}`);
    return data.url;
}

function setUploadStatus(msg) {
    $("uploadStatus").textContent = msg || "";
}

async function handleImageFile(file) {
    setUploadStatus("上传中…");
    try {
        const url = await uploadImageToR2(file);
        insertAtCursor($("contentInput"), `![${file.name || "image"}](${url})`);
        state.editorDirty = true;
        setUploadStatus("已插入 ✓");
        setTimeout(() => setUploadStatus(""), 2000);
    } catch (err) {
        console.error(err);
        setUploadStatus("");
        toast("图片上传失败：" + err.message);
    }
}

/* ============================================================
 * 编辑器
 * ============================================================ */
function openEditor(entry) {
    state.editing = true;
    state.editingId = entry ? entry.id : null;
    state.editorDirty = false;
    state.previewOn = false;

    // 类型：编辑时取笔记类型；新建时默认当前类型筛选
    state.editorType = entry ? entry.type : (state.filterType !== "all" ? state.filterType : "note");
    state.editorTags = entry ? [...(entry.tags || [])] : [];

    // link 类型：把 "URL · 标题" 拆回两个字段
    let title = entry ? entry.title : "";
    let linkUrl = "";
    if (entry && entry.type === "link") {
        const parsed = parseLinkTitle(entry.title);
        if (parsed) { linkUrl = parsed.url; title = parsed.text; }
    }

    $("editorTopTitle").textContent = entry ? "编辑笔记" : "新建笔记";
    $("titleInput").value = title;
    $("linkInput").value = linkUrl;
    $("contentInput").value = entry ? entry.content : "";
    $("previewPane").classList.add("hidden");
    $("contentInput").classList.remove("hidden");
    setUploadStatus("");

    renderEditorTypeChips();
    renderEditorTagChips();
    toggleLinkInput();

    $("readerEmpty").classList.add("hidden");
    $("readerView").classList.add("hidden");
    $("editorView").classList.remove("hidden");
    if (window.innerWidth < 1024) document.body.classList.add("reader-open");
    setTimeout(() => (entry ? $("contentInput") : $("titleInput")).focus(), 50);
}

function renderEditorTypeChips() {
    $("typeChips").innerHTML = TYPE_ORDER.map((t) => `
        <button class="type-chip ${state.editorType === t ? "active" : ""}" data-type="${t}"
                style="${state.editorType === t ? `background:${TYPES[t].color}` : ""}">
            ${icon(TYPES[t].icon)}${TYPES[t].name}
        </button>
    `).join("");
}

function renderEditorTagChips() {
    $("tagChips").innerHTML = state.editorTags.map((tag, i) => `
        <span class="tag-chip">${esc(tag)}
            <button data-tag-index="${i}" title="移除">${icon("close")}</button>
        </span>
    `).join("");
}

function toggleLinkInput() {
    $("linkInput").classList.toggle("hidden", state.editorType !== "link");
}

function markDirty() { state.editorDirty = true; }

function togglePreview() {
    state.previewOn = !state.previewOn;
    if (state.previewOn) {
        $("previewPane").innerHTML = renderMarkdown($("contentInput").value);
        $("previewPane").classList.remove("hidden");
        $("contentInput").classList.add("hidden");
    } else {
        $("previewPane").classList.add("hidden");
        $("contentInput").classList.remove("hidden");
        $("contentInput").focus();
    }
}

async function saveEntry() {
    const type = state.editorType;
    let title = $("titleInput").value.trim();
    const content = $("contentInput").value.trim();
    const tags = [...state.editorTags];

    if (type === "link") {
        const url = $("linkInput").value.trim();
        if (url) title = title ? `${url} · ${title}` : url;
        if (!title && !content) { toast("链接类型请填写 URL 或正文"); return; }
    } else if (!title && !content) {
        toast("内容不能为空");
        return;
    }

    const fields = { title, content, tags, type };
    $("saveBtn").disabled = true;
    try {
        if (state.editingId) {
            const saved = await updateEntry(state.editingId, fields);
            const idx = state.entries.findIndex((e) => e.id === state.editingId);
            if (idx >= 0) state.entries[idx] = saved;
        } else {
            const saved = await createEntry(fields);
            state.entries.unshift(saved);
            state.selectedId = saved.id;
        }
        state.editing = false;
        state.editingId = null;
        state.editorDirty = false;
        fetchFacets();
        renderList();
        renderReader();
        toast("已保存");
    } catch (err) {
        console.error(err);
        toast("保存失败：" + (err.message || "未知错误"));
    } finally {
        $("saveBtn").disabled = false;
    }
}

/* 编辑器有未保存修改时确认 */
async function confirmDiscardIfDirty() {
    if (!state.editing || !state.editorDirty) return true;
    return showConfirm("放弃修改？", "当前编辑内容尚未保存，离开后修改将丢失。", "放弃修改");
}

async function cancelEdit() {
    if (!(await confirmDiscardIfDirty())) return;
    state.editing = false;
    state.editingId = null;
    state.editorDirty = false;
    renderReader();
    if (!state.selectedId && window.innerWidth < 1024) {
        document.body.classList.remove("reader-open");
    }
}

async function onDeleteEntry() {
    const entry = selectedEntry();
    if (!entry) return;
    const ok = await showConfirm(
        "删除这篇笔记？",
        `「${displayTitle(entry)}」将被永久删除，此操作不可恢复。`,
        "删除"
    );
    if (!ok) return;
    try {
        await deleteEntry(entry.id);
        state.entries = state.entries.filter((e) => e.id !== entry.id);
        if (state.selectedId === entry.id) state.selectedId = null;
        fetchFacets();
        renderList();
        renderReader();
        if (window.innerWidth < 1024) document.body.classList.remove("reader-open");
        toast("已删除");
    } catch (err) {
        console.error(err);
        toast("删除失败：" + (err.message || "未知错误"));
    }
}

/* ============================================================
 * 深链接 ?id=<uuid>
 * ============================================================ */
async function handleDeepLink() {
    const id = new URLSearchParams(location.search).get("id");
    if (!id) return;
    history.replaceState(null, "", location.pathname);
    let entry = state.entries.find((e) => e.id === id);
    if (!entry) {
        const { data } = await sb.from("entries").select("*").eq("id", id).single();
        if (data) {
            entry = data;
            state.entries.unshift(data);
            renderList();
        }
    }
    if (entry) selectEntry(entry.id);
    else toast("未找到该笔记");
}

/* ============================================================
 * 筛选 / 搜索
 * ============================================================ */
function setFilterType(type) {
    state.filterType = type;
    renderSidebar();
    fetchEntries(true);
}

function setFilterTag(tag) {
    state.filterTag = state.filterTag === tag ? null : tag;
    renderSidebar();
    fetchEntries(true);
}

const onSearchInput = debounce(() => {
    state.searchQuery = $("searchInput").value.trim();
    fetchEntries(true);
}, SEARCH_DEBOUNCE);

/* ============================================================
 * 事件绑定 & 初始化
 * ============================================================ */
function bindEvents() {
    // ---- 登录页 ----
    $("loginBtn").addEventListener("click", doLogin);
    $("registerBtn").addEventListener("click", doRegister);
    $("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    $("loginEmail").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginPassword").focus(); });

    // ---- 侧栏 ----
    $("typeList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-type]");
        if (btn) { setFilterType(btn.dataset.type); document.body.classList.remove("sidebar-open"); }
    });
    $("tagList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tag]");
        if (btn) { setFilterTag(btn.dataset.tag); document.body.classList.remove("sidebar-open"); }
    });
    $("searchInput").addEventListener("input", () => {
        $("searchClear").classList.toggle("hidden", !$("searchInput").value);
        onSearchInput();
    });
    $("searchClear").addEventListener("click", () => {
        $("searchInput").value = "";
        $("searchClear").classList.add("hidden");
        state.searchQuery = "";
        fetchEntries(true);
    });
    $("logoutBtn").addEventListener("click", doLogout);
    $("changePwdBtn").addEventListener("click", () => {
        $("passwordError").textContent = "";
        $("passwordModal").classList.remove("hidden");
        setTimeout(() => $("newPassword").focus(), 50);
    });
    $("passwordOk").addEventListener("click", doChangePassword);
    $("passwordCancel").addEventListener("click", () => $("passwordModal").classList.add("hidden"));
    $("newPassword2").addEventListener("keydown", (e) => { if (e.key === "Enter") doChangePassword(); });

    // ---- 列表 ----
    $("noteList").addEventListener("click", async (e) => {
        const item = e.target.closest(".note-item");
        if (!item) return;
        if (item.dataset.id === state.selectedId && !state.editing) return;
        if (!(await confirmDiscardIfDirty())) return;
        selectEntry(item.dataset.id);
    });
    $("noteList").addEventListener("scroll", () => {
        const el = $("noteList");
        if (el.scrollTop + el.clientHeight >= el.scrollHeight - 300) fetchEntries(false);
    });
    const onNewNote = async () => {
        if (!(await confirmDiscardIfDirty())) return;
        state.selectedId = null;
        renderListActive();
        openEditor(null);
    };
    $("newNoteBtn").addEventListener("click", onNewNote);
    $("emptyNewBtn").addEventListener("click", onNewNote);
    $("menuBtn").addEventListener("click", () => document.body.classList.add("sidebar-open"));
    $("sidebarOverlay").addEventListener("click", () => document.body.classList.remove("sidebar-open"));

    // ---- 阅读区 ----
    $("backBtn").addEventListener("click", () => document.body.classList.remove("reader-open"));
    $("focusBtn").addEventListener("click", toggleFocusMode);
    $("editBtn").addEventListener("click", () => {
        const entry = selectedEntry();
        if (entry) openEditor(entry);
    });
    $("deleteBtn").addEventListener("click", onDeleteEntry);
    $("readerTags").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tag]");
        if (btn) setFilterTag(btn.dataset.tag);
    });
    $("readerContent").addEventListener("click", (e) => {
        if (e.target.tagName === "IMG") openLightbox(e.target.src);
    });

    // ---- 编辑器 ----
    $("typeChips").addEventListener("click", (e) => {
        const chip = e.target.closest("[data-type]");
        if (!chip) return;
        state.editorType = chip.dataset.type;
        state.editorDirty = true;
        renderEditorTypeChips();
        toggleLinkInput();
    });
    $("tagInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            const tag = $("tagInput").value.trim();
            if (tag && !state.editorTags.includes(tag)) {
                state.editorTags.push(tag);
                state.editorDirty = true;
                renderEditorTagChips();
            }
            $("tagInput").value = "";
        }
    });
    $("tagChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tag-index]");
        if (!btn) return;
        state.editorTags.splice(Number(btn.dataset.tagIndex), 1);
        state.editorDirty = true;
        renderEditorTagChips();
    });
    $("titleInput").addEventListener("input", markDirty);
    $("linkInput").addEventListener("input", markDirty);
    $("contentInput").addEventListener("input", markDirty);
    $("contentInput").addEventListener("paste", (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
            if (item.type.startsWith("image/")) {
                e.preventDefault();
                const file = item.getAsFile();
                if (file) handleImageFile(file);
                return;
            }
        }
    });
    $("uploadImgBtn").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", async () => {
        const files = Array.from($("fileInput").files || []);
        for (const file of files) await handleImageFile(file);
        $("fileInput").value = "";
    });
    $("insertUrlBtn").addEventListener("click", () => {
        const url = prompt("输入图片 URL：");
        if (url && url.trim()) {
            insertAtCursor($("contentInput"), `![image](${url.trim()})`);
            state.editorDirty = true;
        }
    });
    $("previewBtn").addEventListener("click", togglePreview);
    $("saveBtn").addEventListener("click", saveEntry);
    $("cancelEditBtn").addEventListener("click", cancelEdit);
    $("editorBackBtn").addEventListener("click", cancelEdit);
    $("contentInput").addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
            e.preventDefault();
            saveEntry();
        }
    });

    // ---- 确认框 / Lightbox ----
    $("confirmOk").addEventListener("click", () => closeConfirm(true));
    $("confirmCancel").addEventListener("click", () => closeConfirm(false));
    $("confirmModal").addEventListener("click", (e) => { if (e.target === $("confirmModal")) closeConfirm(false); });
    $("lightbox").addEventListener("click", closeLightbox);

    // ---- 全局键盘 ----
    document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!$("lightbox").classList.contains("hidden")) closeLightbox();
        else if (!$("confirmModal").classList.contains("hidden")) closeConfirm(false);
        else if (!$("passwordModal").classList.contains("hidden")) $("passwordModal").classList.add("hidden");
        else if (document.body.classList.contains("focus-mode")) toggleFocusMode();
    });
}

/* Lightbox */
function openLightbox(src) {
    $("lightboxImg").src = src;
    $("lightbox").classList.remove("hidden");
}
function closeLightbox() {
    $("lightbox").classList.add("hidden");
    $("lightboxImg").src = "";
}

/* ============================================================
 * 启动
 * ============================================================ */
(async function init() {
    bindEvents();
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        state.session = session;
        await showApp();
    } else {
        showLogin();
    }
    sb.auth.onAuthStateChange((_event, session) => {
        state.session = session;
        if (session && !$("loginPage").classList.contains("hidden")) showApp();
        if (!session) showLogin();
    });
})();
</script>

</body>
</html>
