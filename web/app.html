        const SELECTION_BUBBLE_DELAY = 500;
        const SELECTION_TEXT_LIMIT = 3000;
        const SELECTION_ROOT_SELECTOR = [
            ".entry-card .card-title",
            ".entry-card .card-content",
            ".reader-title",
            ".reader-content",
        ].join(", ");
        let selectionBubbleTimer = null;
        let selectionBubbleText = "";
        let selectionPointerType = "mouse";
        let selectionPointerActive = false;
        let selectionBubbleInteracting = false;
        let selectionBubbleSuppressUntil = 0;

        function selectionNodeElement(node) {
            if (!node) return null;
            return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        }

        function getSupportedTextSelection() {
            const selection = window.getSelection ? window.getSelection() : null;
            if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;

            const text = selection.toString().trim();
            if (!text) return null;

            const range = selection.getRangeAt(0);
            const startElement = selectionNodeElement(range.startContainer);
            const endElement = selectionNodeElement(range.endContainer);
            const startRoot = startElement && startElement.closest(SELECTION_ROOT_SELECTOR);
            const endRoot = endElement && endElement.closest(SELECTION_ROOT_SELECTOR);

            // Only selections fully contained by the same rendered title or note body are supported.
            if (!startRoot || startRoot !== endRoot || !document.body.contains(startRoot)) return null;
            return { text, range };
        }

        function hideSelectionGptBubble(options = {}) {
            if (selectionBubbleTimer) {
                clearTimeout(selectionBubbleTimer);
                selectionBubbleTimer = null;
            }
            selectionGptBubble.classList.remove("visible");
            selectionGptBubble.setAttribute("aria-hidden", "true");
            if (options.clearText !== false) selectionBubbleText = "";
        }

        function visibleSelectionRect(range, preferLast) {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const rects = Array.from(range.getClientRects()).filter(rect =>
                rect.width > 0 &&
                rect.height > 0 &&
                rect.bottom >= 0 &&
                rect.top <= viewportHeight &&
                rect.right >= 0 &&
                rect.left <= viewportWidth
            );
            if (rects.length > 0) return preferLast ? rects[rects.length - 1] : rects[0];

            const fallback = range.getBoundingClientRect();
            return fallback.width > 0 || fallback.height > 0 ? fallback : null;
        }

        function showSelectionGptBubble() {
            selectionBubbleTimer = null;
            if (
                selectionPointerActive ||
                selectionBubbleInteracting ||
                Date.now() < selectionBubbleSuppressUntil
            ) return;

            const selected = getSupportedTextSelection();
            if (!selected) {
                hideSelectionGptBubble();
                return;
            }

            const isTouch = selectionPointerType === "touch";
            const rect = visibleSelectionRect(selected.range, isTouch);
            if (!rect) {
                hideSelectionGptBubble();
                return;
            }

            selectionBubbleText = selected.text;
            const bubbleWidth = selectionGptBubble.offsetWidth || (isTouch ? 56 : 48);
            const bubbleHeight = selectionGptBubble.offsetHeight || (isTouch ? 44 : 34);
            const edgeGap = 8;
            const selectionGap = isTouch ? 12 : 10;
            let side = isTouch ? "below" : "above";
            let top = side === "above"
                ? rect.top - bubbleHeight - selectionGap
                : rect.bottom + selectionGap;

            if (top < edgeGap) {
                side = "below";
                top = rect.bottom + selectionGap;
            }
            if (top + bubbleHeight > window.innerHeight - edgeGap) {
                side = "above";
                top = Math.max(edgeGap, rect.top - bubbleHeight - selectionGap);
            }

            const left = Math.min(
                window.innerWidth - bubbleWidth - edgeGap,
                Math.max(edgeGap, rect.left + rect.width / 2 - bubbleWidth / 2)
            );

            selectionGptBubble.dataset.side = side;
            selectionGptBubble.style.left = `${Math.round(left)}px`;
            selectionGptBubble.style.top = `${Math.round(top)}px`;
            selectionGptBubble.setAttribute("aria-hidden", "false");
            selectionGptBubble.classList.add("visible");
        }

        function scheduleSelectionGptBubble() {
            if (selectionBubbleInteracting || Date.now() < selectionBubbleSuppressUntil) return;
            if (selectionBubbleTimer) clearTimeout(selectionBubbleTimer);
            selectionBubbleTimer = setTimeout(showSelectionGptBubble, SELECTION_BUBBLE_DELAY);
        }

        document.addEventListener("selectionchange", () => {
            if (!selectionBubbleInteracting) scheduleSelectionGptBubble();
        });

        document.addEventListener("pointerdown", (e) => {
            selectionPointerType = e.pointerType || "mouse";
            if (selectionGptBubble.contains(e.target)) {
                selectionBubbleInteracting = true;
                return;
            }
            if (selectionAiPanel.contains(e.target)) {
                selectionBubbleInteracting = true;
                selectionPointerActive = false;
                hideSelectionGptBubble();
                return;
            }
            if (selectionAiPanel.classList.contains("open")) {
                closeSelectionAiPanel();
            }
            selectionBubbleInteracting = false;
            selectionPointerActive = true;
            hideSelectionGptBubble();
        }, true);

        document.addEventListener("pointerup", (e) => {
            selectionPointerActive = false;
            if (selectionGptBubble.contains(e.target) || selectionAiPanel.contains(e.target)) return;
            selectionPointerType = e.pointerType || selectionPointerType;
            scheduleSelectionGptBubble();
        }, true);

        document.addEventListener("pointercancel", () => {
            selectionPointerActive = false;
            selectionBubbleInteracting = false;
            hideSelectionGptBubble();
        }, true);

        // Safari may emit touch events without matching Pointer Events during native text selection.
        document.addEventListener("touchstart", (e) => {
            selectionPointerType = "touch";
            if (selectionGptBubble.contains(e.target)) {
                selectionBubbleInteracting = true;
                return;
            }
            if (selectionAiPanel.contains(e.target)) {
                selectionBubbleInteracting = true;

                return;

            if (selectionAiPanel.classList.contains("open")) {

            selectionBubbleInteracting = false;
            selectionPointerActive = true;

        }, { passive: true, capture: true });

            const anchorRect = selected

        function entryRenderVersion(entry) {
            const source = JSON.stringify([
                entry.updated_at || "",
                entry.title || "",
                entry.content || "",
                entry.tags || [],
                entry.type || "",
                !!entry.archived,
                entry.archived_at || "",
                entry.pinned_at || ""
            ]);
            let hash = 2166136261;
            for (let i = 0; i < source.length; i++) {
                hash ^= source.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(36);
        }

        // 单张卡片 HTML。motion 只用于真正新增或发生变化的卡片。

            });

                .join("");

                titleHtml = '<div class="card-title link-title"><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">'
                    + esc(displayTitle || url.replace(/^https?:\/\//, "").split("/")[0])
                    + '</a></div>';
            } else {
                const titleText = e.title || (e.content ? e.content.slice(0, 40) : "");
                titleHtml = '<div class="card-title">' + esc(titleText) + '</div>';
            }
            let contentHtml = "";
            if (e.content) {
                const { textHtml, imagesHtml } = renderContentWithImages(e.content, Infinity);
                if (imagesHtml) contentHtml += '<div class="card-images">' + imagesHtml + '</div>';
                if (textHtml) contentHtml += '<div class="card-content">' + textHtml + '</div>';
            }
            const expandBtnHtml = e.content
                ? '<div class="card-expand-area"><button class="card-expand-btn" data-id="' + e.id + '"><span class="material-symbols-rounded">unfold_more</span>展开</button></div>'

            const motionClass = motion === "enter" ? " is-entering" : (motion === "update" ? " is-updating" : "");
            const motionStyle = motion === "enter"
                ? ' style="animation-delay:' + Math.min(animIdx, 8) * 0.025 + 's"'
                : "";
            return '<div class="entry-card' + motionClass + '" data-id="' + esc(e.id) + '" data-render-version="' + entryRenderVersion(e) + '"' + motionStyle + '>' +
                '<div class="card-header">' +
                    '<span class="type-badge" data-type="' + e.type + '">' +
                        '<span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle;margin-right:3px">' + typeIcon + '</span>' +
                        typeNames[e.type] +
                    '</span>' +
                    '<div class="card-actions">' +
                        '<button class="copy-btn" data-id="' + e.id + '" title="复制全部正文" aria-label="复制全部正文"><span class="material-symbols-rounded">content_copy</span></button>' +
                        (state.showDeleted
                            ? '<button class="restore-deleted-btn" data-id="' + e.id + '" title="恢复"><span class="material-symbols-rounded">restore_from_trash</span></button>' +
                              '<button class="permanent-del-btn" data-id="' + e.id + '" title="永久删除"><span class="material-symbols-rounded">delete_forever</span></button>'
                            : state.showArchived
                            ? '<button class="unarchive-btn" data-id="' + e.id + '" title="取消归档"><span class="material-symbols-rounded">unarchive</span></button>'
                            : '<button class="pin-btn' + (e.pinned_at ? ' is-pinned' : '') + '" data-id="' + e.id + '" title="' + (e.pinned_at ? '取消置顶' : '置顶') + '" aria-label="' + (e.pinned_at ? '取消置顶' : '置顶') + '"><span class="pin-glyph" aria-hidden="true">&#9733;</span></button>' +
                              '<button class="edit-btn" data-id="' + e.id + '" title="编辑"><span class="material-symbols-rounded">edit</span></button>' +
                              '<button class="archive-btn" data-id="' + e.id + '" title="归档"><span class="material-symbols-rounded">archive</span></button>'
                        ) +
                        (state.showDeleted ? '' : '<button class="del-btn" data-id="' + e.id + '" title="删除"><span class="material-symbols-rounded">delete</span></button>') +
                    '</div>' +
                '</div>' +
                titleHtml +
                contentHtml +
                expandBtnHtml +
                (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
                '<div class="card-time">' + date + '</div>' +
            '</div>';
        }

        function cardElementFromEntry(entry, index, motion) {
            const template = document.createElement("template");
            template.innerHTML = renderCardHTML(entry, index, motion).trim();
            return template.content.firstElementChild;
        }

        function preserveCardViewState(previousCard, nextCard) {
            const previousContent = previousCard.querySelector(".card-content");
            if (!previousContent || !previousContent.classList.contains("expanded")) return;

            const nextContent = nextCard.querySelector(".card-content");
            const nextButton = nextCard.querySelector(".card-expand-btn");
            if (!nextContent || !nextButton || nextButton.disabled) return;

            nextContent.classList.add("expanded");
            const icon = nextButton.querySelector(".material-symbols-rounded");
            if (icon) icon.textContent = "unfold_less";
            const labelNode = Array.from(nextButton.childNodes)
                .find(node => node.nodeType === Node.TEXT_NODE);
            if (labelNode) labelNode.textContent = "收起";
        }

        // 将云端结果与当前 DOM 对账：相同卡片保留原节点，只处理真正的增删改和排序。
        function reconcileEntryCards(entries) {
            const contentRect = contentArea ? contentArea.getBoundingClientRect() : null;
            const visibleAnchor = contentRect
                ? Array.from(entryList.querySelectorAll(".entry-card"))
                    .find(card => card.getBoundingClientRect().bottom > contentRect.top)
                : null;
            const anchorId = visibleAnchor ? visibleAnchor.dataset.id : null;
            const anchorOffset = visibleAnchor
                ? visibleAnchor.getBoundingClientRect().top - contentRect.top
                : 0;
            const existingById = new Map(
                Array.from(entryList.children)
                    .filter(element => element.classList.contains("entry-card"))
                    .map(element => [element.dataset.id, element])
            );

            entries.forEach((entry, index) => {
                const id = String(entry.id);
                const version = entryRenderVersion(entry);
                let card = existingById.get(id);

                if (!card) {
                    card = cardElementFromEntry(entry, index, "enter");
                } else if (card.dataset.renderVersion !== version) {
                    const replacement = cardElementFromEntry(entry, index, "update");
                    preserveCardViewState(card, replacement);
                    card.replaceWith(replacement);
                    card = replacement;
                }

                existingById.delete(id);
                const elementAtIndex = entryList.children[index];
                if (elementAtIndex !== card) {
                    entryList.insertBefore(card, elementAtIndex || null);
                }
            });

            existingById.forEach(card => card.remove());

            if (contentArea && anchorId) {
                const nextAnchor = Array.from(entryList.querySelectorAll(".entry-card"))
                    .find(card => card.dataset.id === anchorId);
                if (nextAnchor) {
                    const nextOffset = nextAnchor.getBoundingClientRect().top - contentRect.top;
                    const offsetDelta = nextOffset - anchorOffset;
                    if (Math.abs(offsetDelta) > 0.5) contentArea.scrollTop += offsetDelta;
                }
            }
        }

        // 首屏 / 筛选重置：清空列表重新渲染已加载条目
        function renderEntries() {
            let entries = state.entries;
            const titleMap = {
                all: "全部", note: "笔记", thought: "思考", question: "问题", link: "链接", code: "代码"
            };
            contentTitle.textContent = state.showDeleted ? "回收站" : (state.showArchived ? "归档箱" : (titleMap[state.filterType] || "全部"));
            entryCount.textContent = entries.length + " 条";
            // 归档提示条显隐
            const banner = document.getElementById("archiveBanner");
            if (banner) banner.style.display = state.showArchived ? "" : "none";
            // FAB 按钮：归档视图隐藏
            fabBtn.style.display = state.showArchived || state.showDeleted ? "none" : "";
            // 搜索框占位符
            searchInput.placeholder = state.showDeleted ? "搜索回收站笔记…" : (state.showArchived ? "搜索已归档笔记…" : "搜索标题或内容…");
            if (entries.length === 0) {
                entryList.innerHTML = "";
                emptyState.style.display = "";
                // 归档视图空状态文案
                const emptyH3 = emptyState.querySelector("h3");
                const emptyP = emptyState.querySelector("p");
                if (emptyH3) emptyH3.textContent = state.showArchived ? "归档箱为空" : "还没有笔记";
                if (emptyP) emptyP.textContent = state.showArchived ? "归档的笔记会出现在这里" : "点击右下角的 + 按钮开始记录吧";
                renderLoadMore();
                return;
            }
            emptyState.style.display = "none";
            if (entryList.querySelector(".entry-card")) {
                reconcileEntryCards(entries);
            } else {
                entryList.innerHTML = entries.map((e, i) => renderCardHTML(e, i, "enter")).join("");
            }
            renderLoadMore();
        }

        // 追加渲染（分页加载更多时调用）
        function appendEntries(newEntries) {
            if (newEntries.length === 0) return;
            emptyState.style.display = "none";
            const baseIdx = state.entries.length - newEntries.length;
            const html = newEntries.map((e, i) => renderCardHTML(e, baseIdx + i, "enter")).join("");
            entryList.insertAdjacentHTML("beforeend", html);
            renderLoadMore();
        }

        // 底部加载指示器
        function renderLoadMore() {
            let indicator = document.getElementById("loadMoreIndicator");
            if (!indicator) {
                indicator = document.createElement("div");
                indicator.id = "loadMoreIndicator";
                indicator.style.cssText = "text-align:center;padding:24px;color:var(--ink-muted);font-size:13px;font-family:var(--font-ui)";
                entryList.parentNode.appendChild(indicator);
            }
            if (state.loading) {
                indicator.textContent = "加载中…";
                indicator.style.display = "";
            } else if (!state.hasMore) {
                indicator.textContent = "没有更多了";
                indicator.style.display = "";
            } else {
                indicator.style.display = "none";
            }
        }

        // 拉取条目：reset=true 重置到首页（筛选/搜索/增删后）；false 加载下一页
        async function fetchEntries(reset, options = {}) {
            if (!state.session) return;
            if (reset) {
                state.page = 0;
                state.hasMore = true;
                if (!options.keepVisible) {
                    state.entries = [];
                    entryList.innerHTML = "";
                }
            }
            if (!state.hasMore || state.loading) return;
            state.loading = true;
            renderLoadMore();
            const params = new URLSearchParams({
                page: String(state.page),
                pageSize: String(state.pageSize),
                archived: String(state.showArchived),
                deleted: String(state.showDeleted)
            });
            if (state.filterType !== "all") params.set("type", state.filterType);
            if (state.filterTag) params.set("tag", state.filterTag);
            if (state.searchQuery) params.set("q", state.searchQuery);
            let result;
            try {
                result = await apiRequest("/entries?" + params.toString());
            } catch (error) {
                state.loading = false;
                console.error("fetchEntries error:", error);
                renderLoadMore();
                return;
            }
            state.loading = false;
            const fetched = result.entries || [];
            state.hasMore = Boolean(result.hasMore);
            if (reset) {
                state.entries = fetched;
                renderEntries();
            } else {
                state.entries = state.entries.concat(fetched);
                appendEntries(fetched);
            }
            populateTagList();
            state.page++;
            if (isDefaultEntryView()) {
                void writeEntrySnapshot(state.entries);
            }
        }

        async function createEntry(fields) {
            try {
                await apiRequest("/entries", {
                    method: "POST",
                    body: JSON.stringify(fields)
                });
            } catch (error) {
                showToast("创建失败: " + error.message);
                return false;
            }
            invalidateEntrySnapshot();
            fetchEntries(true, { keepVisible: true });
            return true;
        }

        async function updateEntry(id, fields) {
            try {
                const current = state.entries.find(x => x.id === id);
                if (current && !Object.prototype.hasOwnProperty.call(fields, "base_revision_id")) fields.base_revision_id = current.current_revision_id;
                await apiRequest("/entries/" + encodeURIComponent(id), {
                    method: "PATCH",
                    body: JSON.stringify(fields)
                });
            } catch (error) {
                if (error.status === 409) showToast("这条笔记已在其他设备更新，请保留草稿后重新加载");
                else showToast("更新失败: " + error.message);
                return false;
            }
            invalidateEntrySnapshot();
            fetchEntries(true, { keepVisible: true });
            return true;
        }

        async function togglePin(id, pinned) {
            try { await apiRequest("/entries/" + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify({ pinned }) }); }
            catch (error) { showToast("置顶操作失败: " + error.message); return; }
            invalidateEntrySnapshot(); fetchEntries(true, { keepVisible: true });
        }

        async function restoreDeleted(id) {
            try { await apiRequest("/entries/" + encodeURIComponent(id) + "/restore-deleted", { method: "POST" }); }
            catch (error) { showToast("恢复失败: " + error.message); return; }
            invalidateEntrySnapshot(); fetchEntries(true, { keepVisible: true });
        }

        async function permanentDelete(id) {
            if (!confirm("永久删除后无法恢复，确定继续吗？")) return;
            try { await apiRequest("/entries/" + encodeURIComponent(id) + "/permanent", { method: "DELETE" }); }
            catch (error) { showToast("永久删除失败: " + error.message); return; }
            invalidateEntrySnapshot(); fetchEntries(true, { keepVisible: true });
        }

        async function deleteEntry(id) {
            try {
                await apiRequest("/entries/" + encodeURIComponent(id), { method: "DELETE" });
            } catch (error) {
                showToast("删除失败: " + error.message);
                return;
            }
            invalidateEntrySnapshot();
            fetchEntries(true, { keepVisible: true });
            fetchArchivedCount();
        }

        async function archiveEntry(id) {
            try {
                await apiRequest("/entries/" + encodeURIComponent(id), {
                    method: "PATCH",
                    body: JSON.stringify({ archived: true })
                });
            } catch (error) {
                showToast("归档失败: " + error.message);
                return;
            }
            invalidateEntrySnapshot();
            fetchEntries(true, { keepVisible: true });
            fetchArchivedCount();
            showToast("已归档");
        }

        async function unarchiveEntry(id) {
            try {
                await apiRequest("/entries/" + encodeURIComponent(id), {
                    method: "PATCH",
                    body: JSON.stringify({ archived: false })
                });
            } catch (error) {
                showToast("取消归档失败: " + error.message);
                return;
            }
            invalidateEntrySnapshot();
            fetchEntries(true, { keepVisible: true });

        async function fetchArchivedCount() {
            try {
                const result = await apiRequest("/entries/archived-count");
                state.archivedCount = result.count || 0;
                const ac = document.getElementById("archiveCount");
                if (ac) ac.textContent = state.archivedCount;
                const abc = document.getElementById("archiveBannerCount");
                if (abc) abc.textContent = state.archivedCount;
            } catch (error) {
                console.warn("Archived count failed:", error);
            }
        }

        // ===== Render =====
        const typeNames = {
            note: "笔记",
            thought: "思考",
            question: "问题",
            link: "链接",
            code: "代码"
        };

        const typeIcons = {
            note: "description",
            thought: "psychology",
            question: "help",
            link: "link",
            code: "code"
        };

        // ===== Format text with paragraphs =====
        // Configure marked once: GFM + single newline = <br>
        if (typeof marked !== "undefined") {
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
        }

        // ===== Render content as Markdown (preserves separate images block) =====
        function renderContentWithImages(text, maxLen) {
            if (!text) return { textHtml: "", imagesHtml: "" };

            // 1. Extract ![alt](url) image markdown before passing to marked, so images stay in the gallery block at top.
            const imgRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
            const images = [];
            const stripped = text.replace(imgRegex, (_m, alt, url) => {
                images.push({ alt: alt, url: url });
                return "";
            });

            // 2. Optional length cap on the text portion only (used when collapsed previews need a preview slice).
            let source = stripped;
            if (typeof maxLen === "number" && isFinite(maxLen) && stripped.length > maxLen) {
                source = stripped.slice(0, maxLen) + "…";
            }

            // 3. Markdown -> HTML, then XSS sanitize.
            let textHtml = "";
            try {
                if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
                    textHtml = DOMPurify.sanitize(marked.parse(source));
                } else {
                    // CDN failed: graceful fallback to escaped paragraphs (matches old behavior).
                    textHtml = source.split(/\n\n+/).map(p => p.trim() ? "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>" : "").join("");
                }
            } catch (err) {
                console.error("Markdown render failed:", err);
                textHtml = "<p>" + esc(source) + "</p>";
            }

            // 4. Build images HTML (lazy + onerror fallback, same as before).
            const imagesHtml = images.map(({ alt, url }) => {
                const isDataUrl = url.startsWith("data:");
                return '<img src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy"'
                    + (isDataUrl ? ' style="max-height:160px"' : '')
                    + ' onerror="this.style.display=\'none\'">';
            }).join("");

            return { textHtml: textHtml, imagesHtml: imagesHtml };
        }// ===== Sidebar Events =====
        sidebar.addEventListener("click", (e) => {
            const trashBtn = e.target.closest("#trashSidebarBtn");
            if (trashBtn) {
                state.showDeleted = !state.showDeleted;
                state.showArchived = false;
                state.filterType = "all";
                state.filterTag = null;
                sidebar.querySelectorAll(".sidebar-item[data-filter]").forEach(b => b.classList.remove("active"));
                document.getElementById("archiveSidebarBtn")?.classList.remove("active");
                trashBtn.classList.toggle("active", state.showDeleted);
                closeSidebarMobile();
                fetchEntries(true);
                return;
            }
            // 归档按钮
            const archiveBtn = e.target.closest("#archiveSidebarBtn");
            if (archiveBtn) {
                state.showArchived = !state.showArchived;
                state.showDeleted = false;
                document.getElementById("trashSidebarBtn")?.classList.remove("active");
                archiveBtn.classList.toggle("active", state.showArchived);
                // 切换回归档视图时，清除类型筛选的高亮
                if (state.showArchived) {
                    sidebar.querySelectorAll(".sidebar-item[data-filter]").forEach(b => b.classList.remove("active"));
                    state.filterType = "all";
                    state.filterTag = null;
                }
                closeSidebarMobile();
                fetchEntries(true);
                return;
            }
            const btn = e.target.closest(".sidebar-item[data-filter]");
            if (!btn) return;
            sidebar.querySelectorAll(".sidebar-item[data-filter]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            state.filterType = btn.dataset.filter;
            // 点击类型筛选时退出归档视图
            state.showArchived = false;
            state.showDeleted = false;
            const asb = document.getElementById("archiveSidebarBtn");
            if (asb) asb.classList.remove("active");
            document.getElementById("trashSidebarBtn")?.classList.remove("active");
            closeSidebarMobile();
            fetchEntries(true);
        });

        tagList.addEventListener("click", (e) => {
            const btn = e.target.closest(".sidebar-item[data-tag]");
            if (!btn) return;
            state.filterTag = state.filterTag === btn.dataset.tag ? null : btn.dataset.tag;
            closeSidebarMobile();
            fetchEntries(true);
        });

        // ===== Entry Card Events =====
        // 统一的展开/收起函数：供按钮单击、卡片单击、深度链接复用
        function toggleCardExpand(card) {
            if (!card) return;
            const contentEl = card.querySelector(".card-content");
            const expandBtn = card.querySelector(".card-expand-btn");
            if (!contentEl || !expandBtn || expandBtn.disabled) return;
            const isExpanded = contentEl.classList.toggle("expanded");
            expandBtn.querySelector(".material-symbols-rounded").textContent = isExpanded ? "unfold_less" : "unfold_more";
            expandBtn.childNodes[expandBtn.childNodes.length - 1].textContent = isExpanded ? "收起" : "展开";
        }

        // 单/双击区分：单击展开，双击进入编辑页
        let cardClickTimer = null;
        const CARD_DBLCLICK_DELAY = 250;

        entryList.addEventListener("click", (e) => {
            const tagEl = e.target.closest("[data-tag]");
            if (tagEl && tagEl.dataset.tag) {
                state.filterTag = tagEl.dataset.tag;
                fetchEntries(true);
                return;
            }
            const edit = e.target.closest(".edit-btn");
            if (edit) {
                openEntryModal(state.entries.find(x => x.id === edit.dataset.id));
                return;
            }
            const copyBtn = e.target.closest(".copy-btn");
            if (copyBtn) {
                const entry = state.entries.find(x => x.id === copyBtn.dataset.id);
                copyTextToClipboard(entry ? entry.content : "");
                return;
            }
            const pinBtn = e.target.closest(".pin-btn");
            if (pinBtn) {
                const entry = state.entries.find(x => x.id === pinBtn.dataset.id);
                if (entry) togglePin(entry.id, !entry.pinned_at);
                return;
            }
            const restoreDeletedBtn = e.target.closest(".restore-deleted-btn");
            if (restoreDeletedBtn) { restoreDeleted(restoreDeletedBtn.dataset.id); return; }
            const permanentDelBtn = e.target.closest(".permanent-del-btn");
            if (permanentDelBtn) { permanentDelete(permanentDelBtn.dataset.id); return; }
            const del = e.target.closest(".del-btn");
            if (del) {
                openDeleteConfirm(del.dataset.id);
                return;
            }
            const archiveBtn = e.target.closest(".archive-btn");
            if (archiveBtn) {
                archiveEntry(archiveBtn.dataset.id);
                return;
            }
            const unarchiveBtn = e.target.closest(".unarchive-btn");
            if (unarchiveBtn) {
                unarchiveEntry(unarchiveBtn.dataset.id);
                return;
            }
            // 展开按钮：直接展开并阻止冒泡，避免触发卡片本体的单/双击判定
            const expandBtn = e.target.closest(".card-expand-btn");
            if (expandBtn) {
                e.stopPropagation();
                toggleCardExpand(expandBtn.closest(".entry-card"));
                return;
            }
            // 卡片本体（排除操作区/标签区）：单击展开，双击编辑
            const card = e.target.closest(".entry-card");
            // 用户在拖选文本时（如复制），松手会触发 click；此时不响应展开/编辑，避免收起
            if (window.getSelection && window.getSelection().toString().trim()) {
                return;
            }
            if (card && !e.target.closest(".card-actions") && !e.target.closest(".card-tags")) {
                if (cardClickTimer) {
                    clearTimeout(cardClickTimer);
                    cardClickTimer = null;
                    openFullscreenReader(state.entries.find(x => x.id === card.dataset.id));
                } else {
                    cardClickTimer = setTimeout(() => {
                        cardClickTimer = null;
                        toggleCardExpand(card);
                    }, CARD_DBLCLICK_DELAY);
                }
            }
        });

        // ===== Fullscreen Reader (double-click on a card) =====
        function openFullscreenReader(entry) {
            if (!entry) return;
            const date = new Date(entry.created_at).toLocaleDateString("zh-CN", {
                year: "numeric", month: "long", day: "numeric"
            });
            const tagsHtml = (entry.tags || [])
                .map(t => '<span class="tag" data-tag="' + esc(t) + '">' + esc(t) + '</span>')
                .join("");
            const typeIcon = typeIcons[entry.type] || "description";
            const { textHtml, imagesHtml } = renderContentWithImages(entry.content, Infinity);
            const editId = entry.id;
            modalContainer.innerHTML = `
                <div class="fullscreen-reader" id="fullscreenReader">
                    <div class="reader-header">
                        <div class="reader-header-left">
                            <span class="type-badge" data-type="${entry.type}">
                                <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle;margin-right:3px">${typeIcon}</span>
                                ${typeNames[entry.type]}
                            </span>
                            <span class="reader-date">${date}</span>
                        </div>
                        <div class="reader-header-right">
                            ${entry.archived
                                ? '<button class="reader-unarchive-btn" data-id="' + editId + '" title="取消归档"><span class="material-symbols-rounded">unarchive</span><span class="reader-edit-label">取消归档</span></button>'
                                : '<button class="reader-edit-btn" data-id="' + editId + '" title="编辑"><span class="material-symbols-rounded">edit</span><span class="reader-edit-label">编辑</span></button>' +
                                  '<button class="reader-archive-btn" data-id="' + editId + '" title="归档"><span class="material-symbols-rounded">archive</span><span class="reader-edit-label">归档</span></button>'
                            }
                            <button class="reader-history-btn" data-id="${editId}" title="历史"><span class="history-glyph" aria-hidden="true">&#8634;</span><span class="reader-edit-label">历史</span></button>
                            <button class="reader-close-btn" title="关闭 (Esc)">
                                <span class="material-symbols-rounded">close</span>
                            </button>
                        </div>
                    </div>
                    <article class="reader-content-wrap">
                        ${entry.title ? '<h1 class="reader-title">' + esc(entry.title) + '</h1>' : ''}
                        ${tagsHtml ? '<div class="reader-tags">' + tagsHtml + '</div>' : ''}
                        ${imagesHtml ? '<div class="reader-images">' + imagesHtml + '</div>' : ''}
                        <div class="reader-content">${textHtml}</div>
                    </article>
                </div>
            `;
            const root = document.getElementById("fullscreenReader");
            const closeReader = () => { modalContainer.innerHTML = ""; document.removeEventListener("keydown", escHandler); };
            root.addEventListener("click", (e) => {
                if (e.target.closest(".reader-close-btn") || e.target === root) closeReader();
            });
            const editBtn = root.querySelector(".reader-edit-btn");
            if (editBtn) editBtn.addEventListener("click", () => { closeReader(); openEntryModal(state.entries.find(x => x.id === editId)); });
            const archiveReaderBtn = root.querySelector(".reader-archive-btn");
            if (archiveReaderBtn) archiveReaderBtn.addEventListener("click", () => { closeReader(); archiveEntry(archiveReaderBtn.dataset.id); });
            const unarchiveReaderBtn = root.querySelector(".reader-unarchive-btn");
            if (unarchiveReaderBtn) unarchiveReaderBtn.addEventListener("click", () => { closeReader(); unarchiveEntry(unarchiveReaderBtn.dataset.id); });
            const historyBtn = root.querySelector(".reader-history-btn");
            if (historyBtn) historyBtn.addEventListener("click", () => { closeReader(); openHistoryModal(editId); });
            const tagEls = root.querySelectorAll("[data-tag]");
            tagEls.forEach(t => t.addEventListener("click", (e) => { e.stopPropagation(); closeReader(); state.filterTag = t.dataset.tag; fetchEntries(true); }));

        async function openHistoryModal(id) {
            function buildDiffRows(oldText, newText) {
                const oldLines = String(oldText || "").split("\n");
                const newLines = String(newText || "").split("\n");
                if (oldLines.length * newLines.length > 2000000) {
                    return oldLines.map((text, index) => ({ kind: "del", text, oldLine: index + 1, newLine: "" }))
                        .concat(newLines.map((text, index) => ({ kind: "add", text, oldLine: "", newLine: index + 1 })));
                }
                const table = Array.from({ length: oldLines.length + 1 }, () => Array(newLines.length + 1).fill(0));
                for (let oldIndex = oldLines.length - 1; oldIndex >= 0; oldIndex--) {
                    for (let newIndex = newLines.length - 1; newIndex >= 0; newIndex--) {
                        table[oldIndex][newIndex] = oldLines[oldIndex] === newLines[newIndex]
                            ? table[oldIndex + 1][newIndex + 1] + 1
                            : Math.max(table[oldIndex + 1][newIndex], table[oldIndex][newIndex + 1]);
                    }
                }
                const rows = [];
                let oldIndex = 0;
                let newIndex = 0;
                let oldLine = 1;
                let newLine = 1;
                while (oldIndex < oldLines.length || newIndex < newLines.length) {
                    if (oldIndex < oldLines.length && newIndex < newLines.length && oldLines[oldIndex] === newLines[newIndex]) {
                        rows.push({ kind: "context", text: oldLines[oldIndex], oldLine, newLine });
                        oldIndex++; newIndex++; oldLine++; newLine++;
                    } else if (newIndex < newLines.length && (oldIndex === oldLines.length || table[oldIndex][newIndex + 1] >= table[oldIndex + 1][newIndex])) {
                        rows.push({ kind: "add", text: newLines[newIndex], oldLine: "", newLine });
                        newIndex++; newLine++;
                    } else {
                        rows.push({ kind: "del", text: oldLines[oldIndex], oldLine, newLine: "" });
                        oldIndex++; oldLine++;
                    }
                }
                return rows;
            }

            function renderDiff(oldText, newText, oldLabel, newLabel) {
                const rows = buildDiffRows(oldText, newText);
                const lines = rows.map(row => {
                    const prefix = row.kind === "add" ? "+" : (row.kind === "del" ? "−" : " ");
                    return '<div class="history-diff-line diff-' + row.kind + '">' +
                        '<span class="history-diff-number">' + row.oldLine + '</span>' +
                        '<span class="history-diff-number">' + row.newLine + '</span>' +
                        '<span class="history-diff-prefix">' + prefix + '</span>' +
                        '<span>' + esc(row.text) + '</span></div>';
                }).join("");
                return '<div class="history-diff-label"><span>' + esc(oldLabel) + '</span><span>→</span><span>' + esc(newLabel) + '</span></div>' +
                    '<div class="history-diff">' + (lines || '<div class="history-diff-line diff-context"><span></span><span></span><span></span><span>内容一致</span></div>') + '</div>';
            }

            try {
                const result = await apiRequest("/entries/" + encodeURIComponent(id) + "/revisions?pageSize=50");
                const revisions = result.revisions || [];
                modalContainer.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal history-modal"><div class="modal-header"><h3>历史版本</h3><button id="modalClose"><span class="material-symbols-rounded">close</span></button></div><div class="modal-body" id="historyBody"></div></div></div>';
                const body = $("historyBody");
                $("modalClose").addEventListener("click", () => { modalContainer.innerHTML = ""; });
                if (!revisions.length) {
                    body.innerHTML = '<p>暂无历史版本</p>';
                    return;
                }

                const entry = state.entries.find(x => x.id === id);
                const currentRevision = revisions.find(revision => revision.is_current)
                    || revisions.find(revision => revision.id === (entry && entry.current_revision_id))
                    || revisions[0];
                const historicalRevisions = revisions.filter(revision => revision.id !== currentRevision.id);
                let selectedRevision = historicalRevisions[0] || null;

                body.innerHTML = '<div class="history-toolbar">' +
                    '<span class="history-toolbar-title">默认显示所选历史版本与当前版本的差异</span>' +
                    '<div class="history-version-menu">' +
                        '<button class="btn-text history-version-menu-toggle" id="historyVersionMenuToggle" type="button" aria-haspopup="menu" aria-expanded="false">其他版本<span class="history-version-caret" aria-hidden="true">⌄</span></button>' +
                        '<div class="history-version-menu-panel" id="historyVersionMenu" role="menu" hidden></div>' +
                    '</div>' +
                    '</div><div id="historyComparison"></div>';

                const comparison = $("historyComparison");
                const menuToggle = $("historyVersionMenuToggle");
                const menu = $("historyVersionMenu");

                function closeVersionMenu() {
                    menu.hidden = true;
                    menuToggle.setAttribute("aria-expanded", "false");
                }

                function renderVersionMenu() {
                    menu.innerHTML = historicalRevisions.length
                        ? historicalRevisions.map(revision => '<button class="history-version-option" type="button" role="menuitem" data-rid="' + revision.id + '" aria-current="' + (selectedRevision && revision.id === selectedRevision.id ? 'true' : 'false') + '"><strong>v' + revision.revision_no + '</strong><span>' + esc(new Date(revision.created_at).toLocaleString("zh-CN")) + '</span>' + (selectedRevision && revision.id === selectedRevision.id ? '<span class="history-version-check" aria-hidden="true">✓</span>' : '') + '</button>').join('')
                        : '<div style="padding:10px;color:var(--text-secondary);font-size:13px">暂无其他版本</div>';
                    menu.querySelectorAll(".history-version-option").forEach(option => option.addEventListener("click", () => {
                        selectedRevision = historicalRevisions.find(revision => revision.id === option.dataset.rid) || selectedRevision;
                        closeVersionMenu();
                        renderVersionMenu();
                        renderCurrentDiff();
                    }));
                }

                function bindSelectedVersionActions() {
                    const view = $("historyViewSelected");
                    if (view) view.addEventListener("click", () => {
                        comparison.innerHTML = '<div class="history-diff-label"><span>历史版本 v' + selectedRevision.revision_no + '</span></div><pre class="history-version-content">' + esc(selectedRevision.content || '') + '</pre><div class="history-actions"><button class="btn-text" id="historyBackToDiff">返回 Diff</button></div>';
                        $("historyBackToDiff").addEventListener("click", renderCurrentDiff);
                    });

                    const comparePrevious = $("historyComparePrevious");
                    if (comparePrevious) comparePrevious.addEventListener("click", () => {
                        const selectedIndex = revisions.findIndex(revision => revision.id === selectedRevision.id);
                        const previousRevision = revisions[selectedIndex + 1];
                        if (!previousRevision) return;
                        comparison.innerHTML = renderDiff(previousRevision.content || '', selectedRevision.content || '', '上一版本 v' + previousRevision.revision_no, 'v' + selectedRevision.revision_no) + '<div class="history-actions"><button class="btn-text" id="historyBackToDiff">返回默认 Diff</button></div>';
                        $("historyBackToDiff").addEventListener("click", renderCurrentDiff);
                    });

                    const restore = $("historyRestoreSelected");
                    if (restore) restore.addEventListener("click", async () => {
                        if (!entry) return;
                        try {
                            await apiRequest("/entries/" + encodeURIComponent(id) + "/revisions/" + encodeURIComponent(selectedRevision.id) + "/restore", { method: "POST", body: JSON.stringify({ base_revision_id: entry.current_revision_id }) });
                            modalContainer.innerHTML = "";
                            fetchEntries(true, { keepVisible: true });
                            showToast("已恢复为新版本");
                        } catch (error) { showToast("恢复失败: " + error.message); }
                    });
                }

                function renderCurrentDiff() {
                    if (!selectedRevision) {
                        comparison.innerHTML = '<p>当前只有 v' + currentRevision.revision_no + '，生成下一版后将自动显示 Diff。</p>';
                        return;
                    }
                    const selectedIndex = revisions.findIndex(revision => revision.id === selectedRevision.id);
                    const hasPreviousRevision = selectedIndex >= 0 && Boolean(revisions[selectedIndex + 1]);
                    comparison.innerHTML = renderDiff(selectedRevision.content || '', currentRevision.content || (entry ? entry.content : ''), '历史 v' + selectedRevision.revision_no, '当前 v' + currentRevision.revision_no) +
                        '<div class="history-actions"><button class="btn-text" id="historyViewSelected">查看此版本</button>' +
                        (hasPreviousRevision ? '<button class="btn-text" id="historyComparePrevious">与上一版本比较</button>' : '') +
                        '<button class="btn-primary" id="historyRestoreSelected">恢复此版本</button></div>';
                    bindSelectedVersionActions();
                }

                menuToggle.addEventListener("click", () => {
                    const willOpen = menu.hidden;
                    menu.hidden = !willOpen;
                    menuToggle.setAttribute("aria-expanded", String(willOpen));
                });
                body.addEventListener("click", event => {
                    if (!event.target.closest(".history-version-menu")) closeVersionMenu();
                });
                renderVersionMenu();
                renderCurrentDiff();
            } catch (error) { showToast("读取历史失败: " + error.message); }
        }

                        <span class="material-symbols-rounded" style="font-size:18px">cloud_upload</span>
                        <span class="tooltip">上传图片 (≤20MB)</span>
                    `;
                    pasteBtn.parentNode.insertBefore(uploadBtn, pasteBtn.nextSibling);

                    uploadBtn.addEventListener("click", () => {
                        uploadInput.click();
                    });
                }
            }, 50);
        };

        // ===== Init =====
        initSession();
    </script>

</body>
