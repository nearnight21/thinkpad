<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkPad · 学习思考记录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif:opsz,wght@14..42,400;14..42,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== Warm Notebook Design System ===== */
        :root {
            /* Core palette — Warm Humanist */
            --ground:           #F1ECDE;
            --surface-card:     #F8F4EA;
            --surface-darker:   #E6DCC4;
            --ink:              #1A1A18;
            --ink-secondary:    #736D5A;
            --ink-muted:        #9C947C;
            --hairline:         #C8BEA4;
            --accent-peach:     #FFE2C5;
            --accent-sage:      #9DB67A;
            --accent-lavender:  #B0A5D1;
            --accent-salmon:    #F5867B;

            /* Semantic tokens */
            --bg:               var(--ground);
            --surface:          var(--surface-card);
            --text-primary:     var(--ink);
            --text-secondary:   var(--ink-secondary);
            --text-muted:       var(--ink-muted);
            --border:           var(--hairline);
            --border-light:     color-mix(in srgb, var(--hairline) 50%, transparent);

            /* Component colors */
            --primary:          var(--accent-sage);
            --on-primary:       #FFFFFF;
            --primary-container: color-mix(in srgb, var(--accent-sage) 85%, var(--ground));
            --secondary:        var(--accent-lavender);
            --secondary-container: color-mix(in srgb, var(--accent-lavender) 80%, var(--ground));
            --error:            #C94A4A;

            /* Typography */
            --font-display:     "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
            --font-body:        "Source Serif", "Noto Sans SC", Georgia, "Times New Roman", serif;
            --font-ui:          "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;

            /* Spacing scale */
            --space-1: 8px;
            --space-2: 12px;
            --space-3: 16px;
            --space-4: 24px;
            --space-5: 40px;
            --space-6: 64px;

            /* Radii */
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 999px;

            /* Shadows — warm & soft */
            --shadow-sm: 0 1px 3px rgba(115, 109, 90, 0.08);
            --shadow-md: 0 4px 12px rgba(115, 109, 90, 0.10);
            --shadow-lg: 0 8px 24px rgba(115, 109, 90, 0.12);
            --shadow-xl: 0 12px 36px rgba(115, 109, 90, 0.15);
            --shadow-warm: 0 4px 16px rgba(244, 165, 115, 0.12);
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

        /* ===== Animations ===== */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* ===== Login Page ===== */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-4);
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-peach) 0%, transparent 70%);
            opacity: 0.4;
            pointer-events: none;
        }
        .login-page::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-lavender) 0%, transparent 70%);
            opacity: 0.25;
            pointer-events: none;
        }
        .login-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-4) var(--space-4);
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }
        .login-card .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .login-card .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-sage);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card .logo-icon .material-symbols-rounded {
            font-size: 18px;
            color: #fff;
        }
        .login-card .logo-text {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            font-family: var(--font-body);
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font-ui);
            background: #FFFEFA;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .field input:focus {
            border-color: var(--accent-sage);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-sage) 20%, transparent);
        }
        .field input::placeholder {
            color: var(--ink-muted);
        }
        .login-error {
            color: var(--error);
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 20px;
            font-family: var(--font-ui);
        }
        .login-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .login-actions button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .login-actions button:active { transform: scale(0.97); }
        .login-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== Buttons ===== */
        .btn-primary {
            background: var(--primary);
            color: var(--on-primary);
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            box-shadow: var(--shadow-warm);
            background: color-mix(in srgb, var(--accent-sage) 90%, black);
        }
        .btn-secondary {
            background: var(--accent-peach);
            color: var(--ink);
        }
        .btn-secondary:hover {
            background: color-mix(in srgb, var(--accent-peach) 85%, var(--ink));
        }
        .btn-text {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-pill);
            background: transparent;
            color: var(--ink-secondary);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-text:hover {
            background: color-mix(in srgb, var(--accent-peach) 50%, transparent);
            color: var(--text-primary);
        }
        .btn-danger {
            background: var(--error);
            color: #fff;
        }
        .btn-danger:hover {
            background: color-mix(in srgb, var(--error) 85%, black);
        }

        /* ===== App Layout ===== */
        .app-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .app-bar {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 0 var(--space-4);
            height: 64px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .app-bar .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .app-bar .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent-sage);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-bar .logo-icon .material-symbols-rounded {
            font-size: 16px;
            color: #fff;
        }
        .app-bar .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .app-bar .spacer { flex: 1; }
        .app-bar .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: color-mix(in srgb, var(--accent-peach) 40%, transparent);
            border-radius: var(--radius-pill);
            padding: 7px 16px;
            max-width: 240px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .app-bar .search-box:focus-within {
            background: #FFFEFA;
            box-shadow: 0 0 0 2px var(--accent-sage);
        }
        .app-bar .search-box input {
            border: none;
            background: none;
            outline: none;
            font-size: 14px;
            font-family: var(--font-ui);
            color: var(--text-primary);
            width: 100%;
        }
        .app-bar .search-box input::placeholder {
            color: var(--ink-muted);
        }
        .app-bar .search-box .material-symbols-rounded {
            font-size: 18px;
            color: var(--ink-muted);
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--accent-peach);
            color: var(--text-primary);
        }
        .icon-btn .material-symbols-rounded {
            font-size: 22px;
        }

        /* ===== Sidebar ===== */
        .app-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            padding: var(--space-3) var(--space-2);
            border-right: 1px solid var(--border-light);
            overflow-y: auto;
            background: color-mix(in srgb, var(--surface) 60%, var(--bg));
            transition: all 0.3s ease;
        }
        .sidebar-section {
            margin-bottom: var(--space-4);
        }
        .sidebar-section .label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 8px var(--space-2) 6px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px var(--space-2);
            border-radius: var(--radius-pill);
            font-size: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            font-family: var(--font-ui);
            text-align: left;
        }
        .sidebar-item:hover {
            background: var(--accent-peach);
            color: var(--text-primary);
        }
        .sidebar-item.active {
            background: var(--accent-sage);
            color: var(--on-primary);
            font-weight: 600;
        }
        .sidebar-item .material-symbols-rounded {
            font-size: 18px;
        }

        /* ===== Content Area ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4) var(--space-4) 120px;
            animation: slideUp 0.4s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .content-area-inner {
            width: 100%;
        }

        /* ===== Multi-column Masonry ===== */
        .card-masonry {
            columns: 1;
            column-gap: 16px;
        }
        @media (min-width: 900px) {
            .card-masonry {
                columns: 2;
            }
        }
        @media (min-width: 1280px) {
            .card-masonry {
                columns: 3;
            }
        }
        @media (min-width: 1600px) {
            .card-masonry {
                columns: 4;
            }
        }
        .content-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border-light);
        }
        .content-header h2 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .content-header .count-badge {
            font-size: 13px;
            color: var(--ink-muted);
            font-family: var(--font-ui);
        }

        /* ===== Entry Cards ===== */
        .entry-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-2);
            cursor: pointer;
            transition: all 0.25s ease;
            animation: cardEnter 0.35s ease-out both;
            position: relative;
            break-inside: avoid;
            display: inline-block;
            width: 100%;
        }
        .entry-card:nth-child(1) { animation-delay: 0s; }
        .entry-card:nth-child(2) { animation-delay: 0.04s; }
        .entry-card:nth-child(3) { animation-delay: 0.08s; }
        .entry-card:nth-child(4) { animation-delay: 0.12s; }
        .entry-card:nth-child(5) { animation-delay: 0.16s; }
        .entry-card:nth-child(6) { animation-delay: 0.20s; }
        .entry-card:nth-child(n+7) { animation-delay: 0.24s; }
        .entry-card:hover {
            border-color: var(--border);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .entry-card:active {
            transform: translateY(0);
        }
        .entry-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .type-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-peach);
            color: var(--ink);
            display: inline-block;
            font-family: var(--font-ui);
            letter-spacing: 0.3px;
        }
        .type-badge[data-type="thought"] { background: color-mix(in srgb, var(--accent-lavender) 40%, var(--accent-peach)); }
        .type-badge[data-type="question"] { background: color-mix(in srgb, var(--accent-sage) 30%, var(--accent-peach)); }
        .type-badge[data-type="link"] { background: color-mix(in srgb, var(--accent-salmon) 25%, var(--accent-peach)); }
        .type-badge[data-type="code"] { background: var(--secondary-container); color: var(--ink); }
        .entry-card .card-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .entry-card:hover .card-actions {
            opacity: 1;
        }
        .entry-card .card-actions button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .entry-card .card-actions button:hover {
            background: var(--accent-peach);
            color: var(--text-primary);
        }
        .entry-card .card-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.4;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .entry-card .card-content {
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-secondary);
            max-height: calc(1.65em * 2 + 0.5em);
            overflow: hidden;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .entry-card .card-content.expanded {
            max-height: none;
        }
        .entry-card .card-content p {
            margin: 0 0 0.5em;
        }
        .entry-card .card-content p:last-child {
            margin-bottom: 0;
        }
        .entry-card .card-tags {
            display: flex;
            gap: 6px;
            margin-top: var(--space-2);
            flex-wrap: wrap;
        }
        .entry-card .card-tags .tag {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            background: color-mix(in srgb, var(--accent-lavender) 20%, transparent);
            color: var(--ink-secondary);
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all 0.15s ease;
        }
        .entry-card .card-tags .tag:hover {
            background: var(--accent-lavender);
            color: var(--ink);
        }
        .entry-card .card-time {
            font-size: 11px;
            color: var(--ink-muted);
            margin-top: var(--space-2);
            font-family: var(--font-ui);
        }

        /* ===== Card Expand Button ===== */
        .entry-card .card-expand-area {
            display: flex;
            align-items: center;
        }
        .entry-card .card-expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            color: var(--ink-muted);
            font-size: 12px;
            font-family: var(--font-ui);
            cursor: pointer;
            padding: 2px 0;
            transition: color 0.15s ease;
        }
        .entry-card .card-expand-btn:hover {
            color: var(--text-secondary);
        }
        .entry-card .card-expand-btn .material-symbols-rounded {
            font-size: 16px;
        }
        .entry-card .card-content.expanded {
            -webkit-line-clamp: unset;
            display: block;
            overflow: visible;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px 0;
            color: var(--text-secondary);
            animation: fadeIn 0.5s ease-out;
        }
        .empty-state .empty-icon {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-lg);
            background: color-mix(in srgb, var(--accent-peach) 50%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .empty-state .empty-icon .material-symbols-rounded {
            font-size: 36px;
            color: var(--ink-muted);
        }
        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .empty-state p {
            font-size: 14px;
            font-family: var(--font-body);
            color: var(--text-secondary);
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: var(--accent-sage);
            color: var(--on-primary);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 10;
        }
        .fab:hover {
            box-shadow: var(--shadow-xl);
            transform: translateY(-2px);
            background: color-mix(in srgb, var(--accent-sage) 85%, black);
        }
        .fab:active {
            transform: scale(0.92);
        }
        .fab .material-symbols-rounded {
            font-size: 28px;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(26, 26, 24, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3);
            animation: fadeIn 0.2s ease-out;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 560px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            animation: modalIn 0.3s ease-out;

        /* ===== Tag Input ===== */

        /* ===== Confirm Dialog Icon ===== */

        /* ===== Modal Toolbar ===== */

        .modal-toolbar .tool-btn .tooltip {
            display: none;

        .modal-toolbar .tool-label {

        /* ===== Card Images (always visible, no clamp) ===== */

            box-shadow: var(--shadow-md);

        }

            color: var(--accent-sage);
            text-decoration: none;

            text-decoration: underline;
            color: color-mix(in srgb, var(--accent-sage) 80%, black);

            content: "🔗";

            display: none;
            font-size: 12px;
            color: var(--accent-sage);
            font-family: var(--font-ui);

        .paste-indicator.show {
            display: block;
            animation: fadeIn 0.2s ease-out;

        /* ===== Image Lightbox ===== */

            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.78);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

        .lightbox-overlay.open {
            display: flex;
            animation: lbFadeIn 0.25s ease-out;
        }
        @keyframes lbFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .lightbox-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            object-fit: contain;
            cursor: default;
            animation: lbZoomIn 0.25s ease-out;
        }
        @keyframes lbZoomIn {
            from { transform: scale(0.92); opacity: 0; }

        .lightbox-close {
            position: fixed;
            top: 16px;

            font-size: 32px;

        /* ===== Upload Status ===== */

    </style>
</head>
<body>

    <!-- ===== Login Page ===== -->
    <div id="loginPage" class="login-page" style="display:none">

    <!-- ===== Hidden File Input for Upload ===== -->
    <input type="file" id="imageUploadInput" accept="image/*" multiple style="display:none">

    <script>
        // ===== Supabase Init =====
        const SUPABASE_URL = "https://guxfvgiretmstpdionnr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_PFuDLFQULc3QG5eUM3G7IA_vMpCP7bn";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== DOM References =====
        const $ = (id) => document.getElementById(id);
        const loginPage = $("loginPage");
        const appPage = $("appPage");
        const loginEmail = $("loginEmail");
        const loginPassword = $("loginPassword");
        const loginError = $("loginError");
        const loginBtn = $("loginBtn");
        const signupBtn = $("signupBtn");
        const logoutBtn = $("logoutBtn");
        const changePwdBtn = $("changePwdBtn");
        const contentTitle = $("contentTitle");
        const entryCount = $("entryCount");
        const entryList = $("entryList");
        const emptyState = $("emptyState");
        const searchInput = $("searchInput");
        const sidebar = $("sidebar");
        const sidebarToggle = $("sidebarToggle");
        const sidebarOverlay = $("sidebarOverlay");
        const tagList = $("tagList");
        const fabBtn = $("fabBtn");
        const modalContainer = $("modalContainer");

        // ===== State =====
        const state = {
            session: null,
            entries: [],
            filterType: "all",
            filterTag: null,
            searchQuery: ""
        };

        // ===== Image Upload Config =====
        const WORKER_URL = "https://personandb-upload.xiaobai1423.workers.dev";

        // ===== Utilities =====
        function esc(s) {
            if (!s) return "";
            const d = document.createElement("div");
            d.textContent = s;
            return d.innerHTML;
        }

        function populateTagList() {
            const allTags = [...new Set(state.entries.flatMap(e => e.tags || []))].sort();
            if (allTags.length === 0) {
                tagList.innerHTML = '<div class="sidebar-empty-hint" style="padding:8px 12px;font-size:12px;color:var(--ink-dimmed)">暂无标签</div>';
                return;
            }
            tagList.innerHTML = allTags.map(t =>
                '<button class="sidebar-item' + (state.filterTag === t ? ' active' : '') + '" data-tag="' + esc(t) + '">' +
                    '<span class="material-symbols-rounded">label</span> ' + esc(t) +
                '</button>'
            ).join("");
        }

        async function uploadImageToR2(file, onProgress) {
            const ext = file.name.split(".").pop() || "png";
            const key = `img_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const formData = new FormData();
            formData.append("file", file);
            formData.append("key", key);
            const resp = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: formData });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.error || `Upload failed (${resp.status})`);
            }
            const data = await resp.json();
            return data.url;
        }

        function showToast(msg) {
            const el = document.createElement("div");
            el.textContent = msg;
            Object.assign(el.style, {
                position: "fixed",
                bottom: "24px",
                left: "50%",
                transform: "translateX(-50%)",
                background: "var(--ink)",
                color: "#FFFEFA",
                padding: "12px 24px",
                borderRadius: "999px",
                fontSize: "14px",
                fontWeight: 500,
                fontFamily: "var(--font-ui)",
                zIndex: "9999",
                boxShadow: "0 4px 16px rgba(26,26,24,0.2)",
                opacity: "0",
                transition: "opacity 0.3s ease, transform 0.3s ease"
            });
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.opacity = "1"; });
            setTimeout(() => {
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }, 2500);
        }

        function closeSidebarMobile() {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove("open");
                sidebarOverlay.classList.remove("open");
            }
        }

        // ===== View Switching =====
        function showLogin() {
            loginPage.style.display = "";
            appPage.style.display = "none";
            modalContainer.innerHTML = "";
        }

        function showApp() {
            loginPage.style.display = "none";
            appPage.style.display = "";
            fetchEntries();
            // Deep link: ?id=UUID → scroll to and expand specific note
            (function checkDeepLink() {
                var params = new URLSearchParams(window.location.search);
                var deepId = params.get("id");
                if (!deepId) return;
                var wait = setInterval(function() {
                    var card = document.querySelector('.entry-card[data-id="' + deepId + '"]')
                    if (card) {
                        clearInterval(wait);
                        card.scrollIntoView({ behavior: "smooth", block: "center" });
                        setTimeout(function() { toggleCardExpand(card); }, 300);
                        card.style.outline = "2px solid var(--accent-sage)";
                        setTimeout(function() { card.style.outline = ""; }, 2500);
                        // Clean URL
                        if (history.replaceState) {
                            history.replaceState(null, "", "/app");
                        }
                    }
                }, 100);
                // Stop checking after 10s
                setTimeout(function() { clearInterval(wait); }, 10000);
            })();
        }

        // ===== Auth =====
        loginBtn.addEventListener("click", async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) {
                loginError.textContent = "请输入邮箱和密码";
                return;
            }
            loginError.textContent = "";
            loginBtn.disabled = true;
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            loginBtn.disabled = false;
            if (error) {
                loginError.textContent = error.message;
                return;
            }
        });

        signupBtn.addEventListener("click", async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) {
                loginError.textContent = "请输入邮箱和密码";
                return;
            }
            if (password.length < 6) {
                loginError.textContent = "密码至少 6 位";
                return;
            }
            loginError.textContent = "";
            signupBtn.disabled = true;
            const { data, error } = await sb.auth.signUp({ email, password });
            signupBtn.disabled = false;
            if (error) {
                loginError.textContent = error.message;
                return;
            }
            loginError.textContent = "✅ 注册成功！请检查邮箱确认，或直接尝试登录";
        });

        logoutBtn.addEventListener("click", async () => {

        // ===== Format text with paragraphs =====
        function formatParagraphs(text) {
            if (!text) return "";
            const escaped = esc(text);
            // Split by double newline (blank line) into paragraphs
            const paragraphs = escaped.split(/\n\n+/);
            return paragraphs
                .map(p => {
                    if (!p.trim()) return "";
                    // Single newlines within a paragraph become <br>
                    const withBreaks = p.replace(/\n/g, "<br>");
                    return "<p>" + withBreaks + "</p>";
                })
                .join("");
        }

        // ===== Render content with Markdown images =====
        function renderContentWithImages(text, maxLen) {
            // Match image markdown: ![alt](url)
            const imgRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
            let textResult = "";
            let imagesResult = "";
            let lastIdx = 0;
            let match;
            let shortCount = 0;
            const limit = maxLen || Infinity;

            while ((match = imgRegex.exec(text)) !== null) {
                // Text before this image
                const txtBefore = text.slice(lastIdx, match.index);
                if (txtBefore) {
                    const remaining = limit - shortCount;
                    if (shortCount >= limit) {
                        textResult += formatParagraphs(txtBefore);
                    } else if (txtBefore.length <= remaining) {
                        textResult += formatParagraphs(txtBefore);
                        shortCount += txtBefore.length;
                    } else {
                        textResult += esc(txtBefore.slice(0, remaining)) + "\u2026";
                        shortCount = limit;
                    }
                }

                // Image → goes to imagesResult (always visible)
                const alt = match[1];
                const url = match[2];
                const isDataUrl = url.startsWith("data:");
                imagesResult += '<img src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy"'
                    + (isDataUrl ? ' style="max-height:160px"' : '')
                    + ' onerror="this.style.display=\'none\'">';
                lastIdx = match.index + match[0].length;
            }

            // Remaining text
            const txtAfter = text.slice(lastIdx);
            if (txtAfter) {
                if (shortCount < limit) {
                    const remaining = limit - shortCount;
                    if (txtAfter.length <= remaining) {
                        textResult += formatParagraphs(txtAfter);
                    } else {
                        textResult += esc(txtAfter.slice(0, remaining)) + "\u2026";
                    }
                } else {
                    textResult += formatParagraphs(txtAfter);
                }
            }
            return { textHtml: textResult, imagesHtml: imagesResult };
        }

                if (isEdit) {
                    await updateEntry(entry.id, { title: finalTitle, content, tags: tagArr, type });
                } else {
                    await createEntry({ title: finalTitle, content, tags: tagArr, type });
                }
                saveB.disabled = false;
                closeModal();
            });

            setTimeout(() => contentI.focus(), 100);
        }

        // ===== Utility: Format File Size =====
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + "B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + "KB";
            return (bytes / (1024 * 1024)).toFixed(1) + "MB";
        }

        // ===== Delete Confirm Modal =====
        function openDeleteConfirm(id) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="modalOverlay">
                    <div class="modal confirm-dialog">
                        <div class="modal-body">
                            <div class="confirm-icon">
                                <span class="material-symbols-rounded">delete</span>
                            </div>
                            <p>确定要删除这条记录吗？</p>
                            <p style="font-size:13px;color:var(--ink-muted)">此操作不可撤销</p>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-text" id="delCancel">取消</button>
                            <button class="btn-danger" id="delConfirm" style="padding:8px 24px;border:none;border-radius:999px;font-size:14px;font-weight:600;font-family:var(--font-ui);cursor:pointer">删除</button>
                        </div>
                    </div>
                </div>`;

            const overlay = $("modalOverlay");
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) modalContainer.innerHTML = "";
            });
            $("delCancel").addEventListener("click", () => { modalContainer.innerHTML = ""; });
            $("delConfirm").addEventListener("click", async () => {
                await deleteEntry(id);
                modalContainer.innerHTML = "";
                showToast("已删除");
            });
        }

        // ===== Keyboard Shortcuts =====
        loginPassword.addEventListener("keydown", (e) => {
            if (e.key === "Enter") loginBtn.click();
        });
        loginEmail.addEventListener("keydown", (e) => {
            if (e.key === "Enter") loginPassword.focus();
        });

        // ===== Lightbox Logic =====
        const lightbox = $("imageLightbox");
        const lbImage = $("lbImage");
        const lbCloseBtn = $("lbCloseBtn");

        // Delegate: click any image inside entry cards → open lightbox
        entryList.addEventListener("click", (e) => {
            const img = e.target.closest(".entry-card img");
            if (!img) return;
            const src = img.getAttribute("src");
            if (src && src.startsWith("data:")) {
                // data: URLs can be shown directly
                lbImage.src = src;
            } else if (src) {
                lbImage.src = src;
            } else {
                return;
            }
            lightbox.classList.add("open");
        });

        function closeLightbox() {
            lightbox.classList.remove("open");
            // Clear src after animation to free memory for data URLs
            setTimeout(() => { lbImage.src = ""; }, 300);
        }

        lbCloseBtn.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && lightbox.classList.contains("open")) {
                closeLightbox();
            }
        });

        // ===== File Upload via Cloudflare R2 Worker =====
        const uploadInput = $("imageUploadInput");
        const R2_WORKER_URL = "https://personandb-upload.xiaobai1423.workers.dev";

        uploadInput.addEventListener("change", async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (const file of files) {
                try {
                    // Generate unique path: user_id/timestamp_filename
                    const ext = file.name.split(".").pop() || "png";
                    const key = state.session.user.id + "/" +
                        Date.now() + "_" +
                        Math.random().toString(36).slice(2, 8) + "." +
                        ext;

                    // Upload to R2 via Worker
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("key", key);

                    const res = await fetch(R2_WORKER_URL + "/upload", {
                        method: "POST",
                        body: formData,
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        showToast("上传失败: " + (errData.error || res.statusText));
                        continue;
                    }

                    const data = await res.json();
                    const publicUrl = data.url;

                    // Insert image markdown into the content textarea
                    const modalContent = document.getElementById("entryContent");
                    if (modalContent) {
                        const mdImg = "![" + (file.name || "image") + "](" + publicUrl + ")";
                        const start = modalContent.selectionStart;
                        const end = modalContent.selectionEnd;
                        const before = modalContent.value.slice(0, start);
                        const after = modalContent.value.slice(end);
                        modalContent.value = before + mdImg + after;
                        const newPos = start + mdImg.length;
                        modalContent.selectionStart = newPos;
                        modalContent.selectionEnd = newPos;
                        modalContent.focus();
                        showToast("已上传: " + file.name);
                    }
                } catch (err) {
                    showToast("上传异常: " + err.message);
                }
            }
            // Reset input so same file can be picked again
            uploadInput.value = "";
        });

        // ===== Add Upload Button to Modal Toolbar =====
        // We'll inject the button when modal is opened via event delegation on modal-toolbar
        // Better: patch openEntryModal to add the upload button
        const _origOpenEntryModal = openEntryModal;
        openEntryModal = function(entry) {
            _origOpenEntryModal(entry);
            // After modal is rendered, add upload button to toolbar
            setTimeout(() => {
                const toolbar = document.querySelector(".modal-toolbar");
                const pasteBtn = document.getElementById("pasteImgBtn");
                if (toolbar && pasteBtn) {
                    // Check if upload button already exists
                    if (document.getElementById("uploadImgBtn")) return;
                    const uploadBtn = document.createElement("button");
                    uploadBtn.className = "tool-btn";
                    uploadBtn.id = "uploadImgBtn";
                    uploadBtn.title = "上传图片 (至 R2)";
                    uploadBtn.innerHTML = `
                        <span class="material-symbols-rounded" style="font-size:18px">cloud_upload</span>
                        <span class="tooltip">上传图片 (≤10MB)</span>
                    `;
                    pasteBtn.parentNode.insertBefore(uploadBtn, pasteBtn.nextSibling);

                    uploadBtn.addEventListener("click", () => {
                        uploadInput.click();
                    });
                }
            }, 50);
        };

        // ===== Init =====
        initSession();
    </script>

</body>
</html>
